<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>歷屆試題句構練習 Demo</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d8dee9;
      --line-strong: #b8c2d3;
      --blue: #2563eb;
      --blue-soft: #dbeafe;
      --red: #dc2626;
      --red-soft: #fee2e2;
      --green: #16a34a;
      --green-soft: #dcfce7;
      --amber: #d97706;
      --amber-soft: #fef3c7;
      --cyan: #0891b2;
      --cyan-soft: #cffafe;
      --violet: #7c3aed;
      --violet-soft: #ede9fe;
      --shadow: 0 10px 26px rgba(15, 23, 42, .07);
      --small-shadow: 0 1px 2px rgba(15, 23, 42, .08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
      line-height: 1.5;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
    }

    .sidebar {
      height: 100vh;
      min-height: 100vh;
      padding: 18px;
      background: #111827;
      color: #f8fafc;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      gap: 18px;
      position: sticky;
      top: 0;
      overflow: hidden;
    }

    .brand-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-auth {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex: 0 0 auto;
    }

    .brand-auth .auth-status {
      color: #cbd5e1;
      font-size: 11px;
      text-align: right;
      white-space: normal;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }

    .brand p,
    .sidebar-note {
      margin: 6px 0 0;
      color: #cbd5e1;
      font-size: 13px;
    }

    .sidebar-note {
      align-self: end;
    }

    .score-card {
      border: 1px solid rgba(255, 255, 255, .14);
      background: rgba(255, 255, 255, .06);
      border-radius: 8px;
      padding: 14px;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
    }

    .score-value {
      font-weight: 700;
      color: #93c5fd;
    }

    .progress-track {
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
      background: rgba(255, 255, 255, .14);
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: #38bdf8;
      transition: width .2s ease;
    }

    .section-label {
      margin: 0 0 10px;
      color: #94a3b8;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .workspace {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .workspace .main {
      flex: 1;
    }

    .workspace-head {
      background: rgba(255, 255, 255, .92);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(8px);
    }

    /* 桌機：標題＋模式＋操作按鈕全部在同一條 top bar（維持原本版面） */
    .topbar {
      min-height: 70px;
      padding: 14px 22px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
    }

    .top-mode {
      display: flex;
      justify-content: center;
    }

    /* 手機／平板：操作按鈕獨立成一列放在最上方，不固定（捲動時跟著捲走） */
    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 22px;
      background: rgba(255, 255, 255, .92);
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .action-bar[hidden] {
      display: none;
    }

    .action-bar-right {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    @keyframes attention-shake {
      0%, 100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-8px);
      }

      40% {
        transform: translateX(7px);
      }

      60% {
        transform: translateX(-5px);
      }

      80% {
        transform: translateX(4px);
      }
    }

    .lesson-title h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }

    .lesson-title p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
    }

    .auth-status {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .auth-status.connected {
      color: #027a48;
      font-weight: 700;
    }

    .btn {
      min-height: 36px;
      border-radius: 7px;
      padding: 0 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: #344054;
      box-shadow: var(--small-shadow);
    }

    .btn:hover {
      border-color: #9aa8bd;
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: .54;
      box-shadow: none;
    }

    .btn.primary {
      color: #fff;
      border-color: var(--blue);
      background: var(--blue);
    }

    .btn.warning {
      color: #92400e;
      border-color: #fbbf24;
      background: #fef3c7;
    }

    .btn.warning:hover {
      border-color: #f59e0b;
      background: #fde68a;
    }

    .btn.ghost {
      background: #f8fafc;
      box-shadow: none;
    }

    .auth-button.signed-in {
      width: 38px;
      min-width: 38px;
      height: 38px;
      min-height: 38px;
      padding: 0;
      border-radius: 999px;
      overflow: hidden;
      border-color: #86efac;
      background: #ecfdf3;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, .12);
    }

    .auth-avatar-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .auth-avatar-fallback {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: #027a48;
      font-weight: 800;
      font-size: 14px;
    }

    .main {
      padding: 22px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 320px);
      gap: 18px;
      align-items: start;
    }

    .main-stack,
    .aside-stack {
      min-width: 0;
      display: grid;
      gap: 18px;
    }

    .aside-stack {
      position: sticky;
      top: 188px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .practice-panel {
      padding: 20px;
      display: grid;
      gap: 18px;
    }

    .prompt {
      border: 1px solid #fdba74;
      background: #fff7ed;
      color: #9a3412;
      border-radius: 8px;
      padding: 14px;
      display: grid;
      gap: 6px;
    }

    .prompt strong {
      font-size: 17px;
    }

    .prompt span {
      font-size: 14px;
    }

    .chinese-question {
      border: 1px solid #cfd7e6;
      border-radius: 8px;
      background: #fff;
      padding: 18px;
      display: grid;
      gap: 8px;
    }

    .workspace-head .chinese-question {
      margin: 0 22px 14px;
      padding: 12px 14px 12px 16px;
      border-color: #fdba74;
      border-left: 5px solid #f97316;
      background: #fff7ed;
      box-shadow: none;
    }

    .workspace-head .chinese-question h3 {
      color: #7c2d12;
      font-size: 20px;
    }

    .workspace-head .question-label {
      color: #c2410c;
      font-weight: 700;
    }

    .question-label,
    .line-label {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .chinese-question h3 {
      margin: 0;
      font-size: 24px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      min-height: 22px;
      display: inline-flex;
      align-items: center;
      padding: 0 8px;
      border-radius: 999px;
      background: #eef2f7;
      color: #475467;
      font-size: 12px;
    }

    .stage-panel {
      border: 1px solid #e4e9f2;
      border-radius: 8px;
      background: #fbfcfe;
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .stage-panel.shake,
    .prompt.shake {
      animation: attention-shake .36s ease-in-out;
    }

    .stage-bridge[hidden],
    .prompt[hidden],
    .stage-panel[hidden],
    .analysis-box[hidden] {
      display: none;
    }

    .stage-heading {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }

    .stage-heading h3 {
      margin: 0;
      font-size: 18px;
    }

    .stage-heading p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .stage-badge {
      flex: 0 0 auto;
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      padding: 0 9px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 12px;
      font-weight: 700;
    }

    /* 時態與主被動完成後收合成的結果小卡 */
    .decision-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .summary-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
    }

    .summary-chip b {
      color: var(--muted);
      font-weight: 700;
      font-size: 12px;
    }

    .highlighter-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .marker-button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-bottom-width: 3px;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 7px 10px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
    }

    .marker-button::before {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: var(--marker-color, #e5e7eb);
      border: 1px solid rgba(16, 24, 40, .12);
    }

    .marker-button.active {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }

    .marker-button.erase-tool {
      margin-left: auto;
      border-style: dashed;
      color: #475467;
      background: #f8fafc;
    }

    .marker-button.erase-tool.active {
      border-color: #64748b;
      box-shadow: 0 0 0 3px rgba(100, 116, 139, .12);
    }

    .highlight-surface {
      border: 1px solid #e4e9f2;
      border-radius: 8px;
      background: #fff;
      padding: 14px;
      line-height: 2.2;
      font-size: 22px;
      touch-action: none;
      user-select: none;
    }

    .highlight-char {
      min-width: 1.25em;
      min-height: 1.55em;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--ink);
      padding: 0 2px;
      font: inherit;
      vertical-align: baseline;
      cursor: crosshair;
    }

    .highlight-char:hover {
      background: #eef2f7;
    }

    .highlight-char.subject {
      background: rgba(37, 99, 235, .2);
      box-shadow: inset 0 -3px 0 rgba(37, 99, 235, .6);
    }

    .highlight-char.verb {
      background: rgba(220, 38, 38, .18);
      box-shadow: inset 0 -3px 0 rgba(220, 38, 38, .55);
    }

    .highlight-char.object {
      background: rgba(22, 163, 74, .18);
      box-shadow: inset 0 -3px 0 rgba(22, 163, 74, .55);
    }

    .highlight-char.connector {
      background: rgba(124, 58, 237, .16);
      box-shadow: inset 0 -3px 0 rgba(124, 58, 237, .5);
    }

    .highlight-char.bound {
      background: rgba(245, 158, 11, .2);
      box-shadow: inset 0 -3px 0 rgba(245, 158, 11, .58);
    }

    .highlight-char.detail {
      background: rgba(14, 165, 233, .18);
      box-shadow: inset 0 -3px 0 rgba(14, 165, 233, .52);
    }

    .highlight-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .structure-board {
      display: grid;
      gap: 10px;
    }

    .structure-lane {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      align-items: stretch;
    }

    .detail-lane {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .lane-empty {
      min-height: 54px;
      border: 1px dashed #d8dee9;
      border-radius: 8px;
      background: #f8fafc;
      color: #667085;
      padding: 14px;
      font-size: 13px;
      display: grid;
      align-content: center;
    }

    .clause-lane {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .clause-card {
      min-height: 92px;
      border: 1px solid #fed7aa;
      border-radius: 8px;
      background: #fff7ed;
      padding: 12px;
      display: grid;
      gap: 7px;
      align-content: start;
    }

    .clause-card strong {
      color: #9a3412;
      font-size: 14px;
    }

    .clause-card span {
      color: var(--ink);
      font-size: 14px;
      line-height: 1.45;
    }

    .clause-meta {
      color: #667085;
      font-size: 12px;
      line-height: 1.45;
    }

    .slot {
      min-height: 96px;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      background: #fff;
      padding: 10px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
      text-align: left;
      transition: border-color .12s, background .12s, box-shadow .12s;
    }

    .slot:hover,
    .slot.drag-over {
      border-color: var(--blue);
      background: #eff6ff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .1);
    }

    .slot.shake {
      border-color: var(--red);
      background: #fff1f2;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, .14);
      animation: slot-shake .34s ease-in-out;
    }

    @keyframes slot-shake {
      0%,
      100% {
        transform: translateX(0);
      }

      20%,
      60% {
        transform: translateX(-7px);
      }

      40%,
      80% {
        transform: translateX(7px);
      }
    }

    .slot-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .slot-content {
      min-height: 36px;
      display: grid;
      align-content: center;
      color: #98a2b3;
      font-size: 14px;
    }

    .slot.filled {
      border-style: solid;
    }

    .slot.filled .slot-content {
      color: var(--ink);
      font-size: 17px;
      font-weight: 700;
    }

    .token-bank,
    .sentence-bank,
    .built-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: stretch;
    }

    .token {
      min-height: 42px;
      border: 1px solid #cfd7e6;
      border-bottom-width: 3px;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 8px 11px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--small-shadow);
      transition: transform .12s, border-color .12s, background .12s;
      max-width: 100%;
      word-break: break-word;
    }

    .token:hover {
      transform: translateY(-1px);
      border-color: #93c5fd;
    }

    .token.selected {
      border-color: var(--blue);
      background: var(--blue-soft);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .14);
    }

    .token.used {
      opacity: .42;
      pointer-events: none;
    }

    .token.subject,
    .slot.subject.filled {
      background: var(--blue-soft);
      border-color: var(--blue);
    }

    .token.verb,
    .slot.verb.filled {
      background: var(--red-soft);
      border-color: var(--red);
    }

    .token.object,
    .slot.object.filled {
      background: var(--green-soft);
      border-color: var(--green);
    }

    .token.detail,
    .slot.detail.filled {
      background: var(--amber-soft);
      border-color: var(--amber);
    }

    /* 句首導入 / 全句框架：用橘色，和補充細節的琥珀色區隔 */
    .token.lead,
    .slot.lead.filled,
    .lead-lane .slot.filled {
      background: #ffedd5;
      border-color: #f97316;
    }

    /* 子句連接（連接詞）：用紫色，放在子句之間 */
    .token.connector,
    .slot.connector.filled,
    .connector-lane .slot.filled {
      background: var(--violet-soft);
      border-color: var(--violet);
    }

    .tense-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .tense-card,
    .choice-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 12px;
      display: grid;
      gap: 3px;
      text-align: left;
      box-shadow: var(--small-shadow);
    }

    .tense-card strong,
    .choice-card strong {
      font-size: 15px;
    }

    .tense-card span,
    .choice-card span {
      color: var(--muted);
      font-size: 12px;
    }

    .tense-card:hover,
    .choice-card:hover {
      border-color: #93c5fd;
    }

    .tense-card.selected,
    .choice-card.selected {
      border-color: var(--blue);
      background: #eff6ff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }

    .tense-card.wrong,
    .choice-card.wrong {
      border-color: var(--red);
      background: #fff1f2;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, .12);
    }

    .decision-guide {
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      background: #eff6ff;
      color: #1e3a8a;
      padding: 12px 14px;
      display: grid;
      gap: 5px;
    }

    .decision-guide.error {
      border-color: #fecaca;
      background: #fff7f7;
      color: #991b1b;
    }

    .decision-guide strong {
      font-size: 15px;
    }

    .decision-guide span {
      color: inherit;
      font-size: 14px;
    }

    .choice-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .choice-card {
      min-height: 72px;
      align-content: center;
      text-align: center;
    }

    .choice-card strong {
      font-size: 18px;
    }

    .builder-box {
      border: 1px solid #e4e9f2;
      border-radius: 8px;
      background: #fff;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .built-line {
      min-height: 56px;
      padding: 8px;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      background: #f8fafc;
    }

    .built-placeholder {
      color: #98a2b3;
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      font-size: 14px;
    }

    .answer-box {
      border: 1px solid #abefc6;
      border-radius: 8px;
      background: #ecfdf3;
      color: #027a48;
      padding: 14px;
      display: grid;
      gap: 7px;
    }

    .answer-box strong {
      font-size: 18px;
      color: #075e3d;
    }

    .analysis-box {
      border: 1px solid #dbeafe;
      border-radius: 8px;
      background: #f8fbff;
      color: #344054;
      padding: 14px;
      display: grid;
      gap: 5px;
    }

    .analysis-box.error {
      border-color: #fecaca;
      background: #fff7f7;
      color: #991b1b;
    }

    .analysis-box.correct {
      border-color: #abefc6;
      background: #f0fdf4;
      color: #027a48;
    }

    .analysis-box strong {
      font-size: 15px;
    }

    .unlock-panel {
      border: 1px solid #bae6fd;
      background: #f0f9ff;
    }

    .learning-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .learning-card {
      border: 1px solid #d8dee9;
      border-radius: 8px;
      background: #fff;
      padding: 12px;
      display: grid;

  <script type="module">
    const firebaseConfig = {
      apiKey: "AIzaSyBc6KQ6hFGZMmzzvv8bx-CHPUKrHU-xSm0",
      authDomain: "high-traslate.firebaseapp.com",
      projectId: "high-traslate",
      storageBucket: "high-traslate.firebasestorage.app",
      messagingSenderId: "643857471181",
      appId: "1:643857471181:web:4f2c5ecf7d71b9d49f3b84",
      measurementId: "G-J953V988V7"
    };

    const hasFirebaseConfig = firebaseConfig.apiKey && firebaseConfig.projectId && firebaseConfig.appId;
    const backend = {
      enabled: false,
      error: null,
      firebaseReady: false,
      signedIn: false,
      uid: null,
      email: null,
      displayName: null,
      photoURL: null,
      signIn: async () => {},
      signOut: async () => {},
      loadStore: async () => null,
      saveStore: async () => {}
    };

    window.practiceProgressBackend = backend;
    document.documentElement.dataset.firebaseProgress = hasFirebaseConfig ? "loading" : "local";

    function setFirebaseProgressStatus(status, error = "") {
      document.documentElement.dataset.firebaseProgress = status;
      if (error) {
        document.documentElement.dataset.firebaseProgressError = error;
      } else {
        delete document.documentElement.dataset.firebaseProgressError;
      }
    }

    function firebaseAuthErrorMessage(error) {
      const message = error?.message || String(error || "");
      const code = error?.code || message;
      if (code.includes("auth/operation-not-allowed")) {
        return "Google 登入尚未在 Firebase Authentication 啟用。請到 Sign-in method 開啟 Google。";
      }
      if (code.includes("auth/popup-blocked")) {
        return "瀏覽器擋住登入視窗，請允許這個網站的彈出式視窗。";
      }
      if (code.includes("auth/popup-closed-by-user")) {
        return "登入視窗已關閉，尚未完成登入。";
      }
      if (code.includes("auth/unauthorized-domain")) {
        return "這個網址尚未加入 Firebase Authorized domains。";
      }
      return message || "Google 登入失敗，請稍後再試。";
    }

    async function initializeFirebaseProgress() {
      if (!hasFirebaseConfig) {
        setFirebaseProgressStatus("local");
        document.dispatchEvent(new CustomEvent("practice-progress-backend-ready", { detail: { backend } }));
        return;
      }

      try {
        const [{ initializeApp }, authSdk, firestore] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js"),
          import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js")
        ]);
        const { getAuth, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signOut } = authSdk;
        const { doc, getDoc, getFirestore, serverTimestamp, setDoc } = firestore;
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const getProgressDoc = (uid) => doc(db, "users", uid, "practiceProgress", "examStructurePractice");
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });

        backend.firebaseReady = true;
        backend.signIn = async () => signInWithPopup(auth, provider);
        backend.signOut = async () => signOut(auth);
        backend.loadStore = async () => {
          if (!auth.currentUser) return null;
          const user = auth.currentUser;
          const snapshot = await getDoc(getProgressDoc(user.uid));
          if (!snapshot.exists()) return null;
          const data = snapshot.data();
          return {
            lastQuestionId: data.lastQuestionId || null,
            questions: data.questions && typeof data.questions === "object" ? data.questions : {}
          };
        };
        backend.saveStore = async (store) => {
          if (!auth.currentUser) return;
          const user = auth.currentUser;
          await setDoc(getProgressDoc(user.uid), {
            lastQuestionId: store.lastQuestionId || null,
            questions: store.questions && typeof store.questions === "object" ? store.questions : {},
            updatedAt: serverTimestamp()
          }, { merge: true });
        };
        getRedirectResult(auth).catch((error) => {
          backend.error = error;
          setFirebaseProgressStatus("error", firebaseAuthErrorMessage(error));
          console.warn("Google redirect sign-in failed.", error);
        });
        onAuthStateChanged(auth, (user) => {
          if (user?.isAnonymous) {
            signOut(auth);
            return;
          }

          backend.enabled = Boolean(user);
          backend.signedIn = Boolean(user);
          backend.uid = user?.uid || null;
          backend.email = user?.email || null;
          backend.displayName = user?.displayName || null;
          backend.photoURL = user?.photoURL || null;
          setFirebaseProgressStatus(user ? "connected" : "signed-out");
          document.dispatchEvent(new CustomEvent("practice-progress-auth-changed", { detail: { backend } }));
          document.dispatchEvent(new CustomEvent("practice-progress-backend-ready", { detail: { backend } }));
        });
      } catch (error) {
        backend.error = error?.message || String(error);
        setFirebaseProgressStatus("error", backend.error);
        console.warn("Firebase progress sync is unavailable. Falling back to localStorage.", error);
        document.dispatchEvent(new CustomEvent("practice-progress-backend-ready", { detail: { backend } }));
      }
    }

    initializeFirebaseProgress();
  </script>
  <script>
    /* =========================================================
       AI 小老師設定

    const AI_TUTOR_CONFIG = {
      useAi: true,
      endpoint: "/api/tutor"
    };

    const tenseOptions = [
      { id: "present-simple", label: "現在簡單式", pattern: "do / does" },
      { id: "present-continuous", label: "現在進行式", pattern: "am/is/are + V-ing" },
      { id: "present-perfect", label: "現在完成式", pattern: "have/has + p.p." },
      { id: "past-simple", label: "過去簡單式", pattern: "V-ed / irregular past" },
      { id: "past-continuous", label: "過去進行式", pattern: "was/were + V-ing" },
      { id: "past-perfect", label: "過去完成式", pattern: "had + p.p." },
      { id: "future-simple", label: "未來簡單式", pattern: "will + V" },
      { id: "future-continuous", label: "未來進行式", pattern: "will be + V-ing" },
      { id: "future-perfect", label: "未來完成式", pattern: "will have + p.p." },
      { id: "modal-simple", label: "情態助動詞", pattern: "should/must/can + V" }
    ];

    const voiceOptions = [
      { id: "active", label: "主動語態", pattern: "主詞執行動作" },
      { id: "passive", label: "被動語態", pattern: "受詞承受動作" }
    ];

    function makeExamQuestion(data) {
      const detailTokens = data.details.map((detail, index) => ({
        id: detail.id || `d${index + 1}`,

    function readSavedProgress() {

        const parsed = JSON.parse(raw);
        return {
          lastQuestionId: parsed.lastQuestionId || null,
          questions: parsed.questions && typeof parsed.questions === "object" ? parsed.questions : {}
        };

    function writeSavedProgress(store) {
      try {
        localStorage.setItem(progressStorageKey, JSON.stringify(store));

      }
      scheduleCloudProgressSave(store);

    function normalizeProgressStore(store) {
      return {
        lastQuestionId: store?.lastQuestionId || null,
        questions: store?.questions && typeof store.questions === "object" ? store.questions : {}
      };
    }

    function mergeProgressStores(localStore, remoteStore) {
      const local = normalizeProgressStore(localStore);
      const remote = normalizeProgressStore(remoteStore);
      const mergedQuestions = { ...local.questions };

      Object.entries(remote.questions).forEach(([questionId, remoteProgress]) => {
        const localProgress = mergedQuestions[questionId];
        const localUpdatedAt = Number(localProgress?.updatedAt) || 0;
        const remoteUpdatedAt = Number(remoteProgress?.updatedAt) || 0;
        if (!localProgress || remoteUpdatedAt >= localUpdatedAt) {
          mergedQuestions[questionId] = remoteProgress;
        }
      });

      return {
        lastQuestionId: remote.lastQuestionId || local.lastQuestionId,
        questions: mergedQuestions
      };
    }

    function scheduleCloudProgressSave(store) {
      const backend = window.practiceProgressBackend;
      if (!backend?.enabled || typeof backend.saveStore !== "function") return;

      document.documentElement.dataset.firebaseProgressSave = "saving";
      delete document.documentElement.dataset.firebaseProgressSaveError;
      const snapshot = normalizeProgressStore(JSON.parse(JSON.stringify(store)));
      lastCloudProgressSave = lastCloudProgressSave
        .catch(() => {})
        .then(() => backend.saveStore(snapshot))
        .then(() => {
          document.documentElement.dataset.firebaseProgressSave = "saved";
        })
        .catch((error) => {
          document.documentElement.dataset.firebaseProgressSave = "error";
          document.documentElement.dataset.firebaseProgressSaveError = error?.message || String(error);
          console.warn("Firebase progress save failed. Local progress is still saved.", error);
        });
    }

    function applyRemoteProgressStore(remoteStore) {
      const mergedStore = mergeProgressStores(readSavedProgress(), remoteStore);
      try {
        localStorage.setItem(progressStorageKey, JSON.stringify(mergedStore));

        return "瀏覽器擋住登入視窗，請允許這個網站的彈出式視窗。";
      }
      if (code.includes("auth/popup-closed-by-user")) {
        return "登入視窗已關閉，尚未完成登入。";
      }
      if (code.includes("auth/unauthorized-domain")) {
        return "這個網址尚未加入 Firebase Authorized domains。";
      }
      return message || "Google 登入失敗，請稍後再試。";

    function saveCurrentProgress() {

      const wasCompleted = Boolean(previous.wasCompleted || previous.completed || previous.revealed);

    function restoreQuestionState() {
      resetWorkingState();
      const saved = readSavedProgress().questions[question().id];
      if (!saved || saved.isRedoing) return;

      const tokenSlots = new Set(allStructureTokens().map((token) => token.slot));
      const tokenIds = new Set(allStructureTokens().map((token) => token.id));
      const pieceIds = new Set(question().answerPieces.map((piece) => piece.id));

      highlightDone = Boolean(saved.highlightDone || saved.revealed || saved.completed || Object.keys(saved.placements || {}).length);
      selectedMarker = markerOptions.some((marker) => marker.id === saved.selectedMarker) ? saved.selectedMarker : "subject";
      highlightMarks = saved.highlightMarks && typeof saved.highlightMarks === "object" ? saved.highlightMarks : {};
      placements = Object.fromEntries(
        Object.entries(saved.placements || {}).filter(([slot, tokenId]) => tokenSlots.has(slot) && tokenIds.has(tokenId))
      );
      selectedTense = tenseById(saved.selectedTense) ? saved.selectedTense : null;
      selectedVoice = voiceById(saved.selectedVoice) ? saved.selectedVoice : null;
      builtPieces = Array.isArray(saved.builtPieces) ? saved.builtPieces.filter((id) => pieceIds.has(id)) : [];
      phraseWordBuilds = {};
      if (saved.phraseWordBuilds && typeof saved.phraseWordBuilds === "object") {
        const validWordIds = new Set();
        question().answerPieces.forEach((piece) => pieceWordTokens(piece).forEach((token) => validWordIds.add(token.id)));
        Object.entries(saved.phraseWordBuilds).forEach(([pieceId, ids]) => {
          if (!Array.isArray(ids)) return;
          const filtered = ids.filter((id) => validWordIds.has(id));
          if (filtered.length) phraseWordBuilds[pieceId] = filtered;
        });
      }
      revealed = Boolean(saved.revealed || saved.completed);
      hasAttempted = Boolean(
        saved.hasAttempted
        || saved.revealed
        || saved.completed
        || saved.selectedTense
        || saved.selectedVoice
        || Object.keys(saved.placements || {}).length
      );
      stage = Math.min(Math.max(Number(saved.stage) || 1, 1), 4);

      if (!isHighlightDone()) stage = 1;
      if (isHighlightDone()) stage = Math.max(stage, 2);
      if (isStageOneDone()) stage = Math.max(stage, 3);
      if (isDecisionDone()) stage = Math.max(stage, 4);
      if (revealed) stage = 4;
    }

    function tenseById(id) {
      return tenseOptions.find((tense) => tense.id === id);
    }

    function voiceById(id) {
      return voiceOptions.find((voice) => voice.id === id);
    }

    function seededShuffle(items, seedText) {
      let seed = 0;
      for (let i = 0; i < seedText.length; i += 1) {
        seed = (seed * 31 + seedText.charCodeAt(i)) >>> 0;
      }
      const result = items.slice();
      for (let i = result.length - 1; i > 0; i -= 1) {
        seed = (seed * 1103515245 + 12345) & 0x7fffffff;
        const j = seed % (i + 1);
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    // 進階模式用：把一個英文片段按空白拆成單字（連字號詞、標點都黏在原本的字上）。
    function tokenizePieceWords(text) {
      return String(text).split(/\s+/).filter(Boolean);
    }

    function pieceWordTokens(piece) {
      return tokenizePieceWords(piece.text).map((text, index) => ({ id: `${piece.id}::w${index}`, text }));
    }

    function wordTextById(piece, wordId) {
      const token = pieceWordTokens(piece).find((item) => item.id === wordId);
      return token ? token.text : "";
    }

    // 3 個字以上的片語才需要學生逐字重組；2 個字以下視為自動完成。
    function isPieceBuilt(piece) {
      const tokens = pieceWordTokens(piece);
      if (tokens.length < 3) return true;
      const placed = phraseWordBuilds[piece.id] || [];
      if (placed.length !== tokens.length) return false;
      const builtText = placed.map((id) => wordTextById(piece, id)).join(" ");
      return builtText === tokens.map((token) => token.text).join(" ");
    }

    function buildablePieces(data) {
      return data.answerPieces.filter((piece) => pieceWordTokens(piece).length >= 3);
    }

    // 進階模式：取得一個英文片段對應的中文。優先用本題固定片語的完整中文（最精準），
    // 找不到再用片語表／全域單字表逐段拼出（只取每個字的第一個語意，避免一串分號）。
    function pieceChinese(piece, glossary) {
      const data = question();
      const key = normalizeGlossKey(piece.text);
      const exact = (data.phraseNotes || []).find((note) => normalizeGlossKey(note.text) === key);
      if (exact && exact.meaning) return exact.meaning;
      const firstSense = (zh) => String(zh).split(/[；、，/]/)[0];
      const chunks = String(piece.text).split(" ");
      const clean = chunks.map((chunk) => chunk.toLowerCase().replace(/[^a-z0-9'-]/g, ""));
      const parts = [];
      let i = 0;
      while (i < chunks.length) {
        let matched = null;
        for (const entry of glossary) {
          const len = entry.words.length;
          if (i + len > chunks.length) continue;
          let ok = true;
          for (let j = 0; j < len; j++) {
            if (clean[i + j] !== entry.words[j]) { ok = false; break; }
          }
          if (ok) { matched = { entry, len }; break; }
        }
        if (matched) {
          if (matched.entry.value.zh) parts.push(firstSense(matched.entry.value.zh));
          i += matched.len;
          continue;
        }
        const word = clean[i];
        const zh = word && !GLOSS_STOPWORDS.has(word) ? WORD_GLOSS[word] : null;
        if (zh) parts.push(firstSense(zh));
        i += 1;
      }
      return parts.join("");
    }

    function isPhraseStageDone(data) {
      if (practiceMode !== "advanced") return true;
      return data.answerPieces.every(isPieceBuilt);
    }

    function togglePracticeMode() {
      practiceMode = practiceMode === "advanced" ? "simple" : "advanced";
      try {
        localStorage.setItem(practiceModeKey, practiceMode);
      } catch {
        // 無法寫入時仍能在本次操作中使用該模式。
      }
      render();
    }

    function addPhraseWord(wordId) {
      const pieceId = wordId.split("::")[0];
      const current = phraseWordBuilds[pieceId] || [];
      if (current.includes(wordId)) return;
      phraseWordBuilds[pieceId] = [...current, wordId];
      hasAttempted = true;

      const piece = question().answerPieces.find((item) => item.id === pieceId);
      if (piece) {
        const total = pieceWordTokens(piece).length;
        if (isPieceBuilt(piece)) {
          els.feedback.className = "feedback correct";
          els.feedback.textContent = `片語「${piece.text}」組好了。`;
        } else if (phraseWordBuilds[pieceId].length >= total) {
          els.feedback.className = "feedback error";
          els.feedback.textContent = "這個片語的單字順序還不對，點一下已放的字可以移除重排。";
        }
      }
      render();
    }

    function removePhraseWord(wordId) {
      const pieceId = wordId.split("::")[0];
      phraseWordBuilds[pieceId] = (phraseWordBuilds[pieceId] || []).filter((id) => id !== wordId);
      render();
    }

    function completedStages() {
      let count = 0;
      if (isHighlightDone()) count += 1;
      if (isStageOneDone()) count += 1;
      if (isDecisionDone()) count += 1;
      if (isSentenceDone()) count += 1;
      return count;
    }

    function isHighlightDone() {
      return highlightDone;
    }

    function isStageOneDone() {
      return allStructureTokens().every((token) => placements[token.slot] === token.id);
    }

    function isDecisionDone() {
      return selectedTense === question().tense && selectedVoice === question().voice;
    }

    function isSentenceDone() {
      const expected = question().answerPieces.map((piece) => piece.id).join("|");
      return isDecisionDone() && builtPieces.join("|") === expected;
    }

    function canRevealAnswer() {
      // 一般帳號：四個步驟（螢光筆、拆句、時態主被動、英文組句）全部做完才能看答案。
      // （拿掉「動一下就解鎖」的 hasAttempted。）特權／開發帳號不受限制；
      // revealed 維持「揭露過就保持開啟」；wasCompleted 讓按重新作答後仍可顯示答案。
      if (DEV_ALWAYS_REVEAL || isPrivilegedUser() || revealed || completedStages() === 4) return true;
      const saved = readSavedProgress().questions[question().id];
      return Boolean(saved && saved.wasCompleted);
    }

    function currentStageElement() {
      if (!els.stageBridge.hidden) return els.stageBridge;
      if (!isHighlightDone()) return els.stageHighlight;
      if (!isStageOneDone()) return els.stageOne;
      if (!isDecisionDone()) return els.stageTwo;
      if (practiceMode === "advanced" && !isPhraseStageDone(question())) return els.stagePhrase;
      return els.stageThree;
    }

    function shakeCurrentStage() {
      const target = currentStageElement();
      if (!target) return;
      window.clearTimeout(attentionShakeTimer);
      target.classList.remove("shake");
      void target.offsetWidth;
      target.classList.add("shake");
      attentionShakeTimer = window.setTimeout(() => {
        target.classList.remove("shake");
      }, 380);
    }

    function resetQuestion() {
      const prevSaved = readSavedProgress().questions[question().id];
      const wasCompleted = Boolean(prevSaved && (prevSaved.completed || prevSaved.revealed || prevSaved.wasCompleted));
      if (wasCompleted) {
        // 保留原本的完整紀錄，加上 isRedoing 標記，讓 Firebase 不遺失舊作答資料。
        // 等學生重做完成後，saveCurrentProgress() 才用新資料覆蓋。
        const store = readSavedProgress();
        store.questions[question().id] = { ...prevSaved, wasCompleted: true, isRedoing: true };
        writeSavedProgress(store);
      } else {
        clearCurrentSavedProgress();
      }
      stage = 1;
      highlightDone = false;
      selectedMarker = "subject";
      highlightMarks = {};
      placements = {};
      selectedTokenId = null;
      selectedTense = null;
      selectedVoice = null;
      builtPieces = [];
      phraseWordBuilds = {};
      revealed = false;
      analysisMessage = null;
      hasAttempted = false;
      hintMessage = "先找中文句子的「誰做事、做什麼、作用到誰或什麼」，再用顏色標出來。";
      els.feedback.className = "feedback";
      els.feedback.textContent = "先用螢光筆標出你看到的中文結構；這一段不評分。";
      render();
    }

    function selectQuestion(index) {
      questionIndex = index;
      restoreQuestionState();
      render();
    }

    function tokenById(id) {
      return allStructureTokens().find((token) => token.id === id);
    }

    function tokenForSlot(slot) {
      return allStructureTokens().find((token) => token.slot === slot);
    }

    function allStructureTokens() {
      return [...question().core, ...question().details];
    }

    function labelForSlot(slot) {
      const token = tokenForSlot(slot);
      return token ? token.label : slotLabels[slot];
    }

    function isBoundModifierToken(token) {
      const boundLabels = new Set([
        "描述",
        "程度",
        "特色",
        "狀態",
        "數量",
        "方式",
        "時間先後",
        "時間延續"
      ]);
      return token?.role === "bound" || boundLabels.has(token?.label);
    }

    function compactChineseText(value) {
      return String(value || "").replace(/[，。；、,.;\s]/g, "");
    }

    function tokenAppearsNearSentenceStart(data, token) {
      const sentence = compactChineseText(data.chinese);
      const tokenText = compactChineseText(token?.text);
      if (!sentence || !tokenText) return false;
      const probeLength = Math.min(Math.max(tokenText.length, 2), 4);
      const index = sentence.indexOf(tokenText.slice(0, probeLength));
      return index >= 0 && index <= 6;
    }

    function hasMultipleCoreGroups(data) {
      return (data.coreGroups || []).length > 1;
    }

    function isSentenceLeadToken(data, token) {
      const leadLabels = new Set(["轉折", "語氣", "附加", "比較", "讓步", "條件"]);
      const contextualLeadLabels = new Set(["時間", "情境", "對象", "環境"]);
      const clauseConnectorLabels = new Set(["轉折", "附加", "讓步", "條件"]);
      if (token?.role === "lead") return true;
      if (hasMultipleCoreGroups(data) && clauseConnectorLabels.has(token?.label)) return true;
      if (leadLabels.has(token?.label)) return tokenAppearsNearSentenceStart(data, token);
      return contextualLeadLabels.has(token?.label) && tokenAppearsNearSentenceStart(data, token);
    }

    function detailGroupSlots(data, group) {
      return data.details
        .filter((detail) => {
          // 題目可用 detail.group（"lead" / "bound" / "supplemental"）明確指定欄位，覆寫依中文位置判斷的啟發式。
          if (detail.group) return detail.group === group;
          if (group === "lead") return isSentenceLeadToken(data, detail);
          if (group === "bound") return !isSentenceLeadToken(data, detail) && isBoundModifierToken(detail);
          return !isSentenceLeadToken(data, detail) && !isBoundModifierToken(detail);
        })
        .map((detail) => detail.slot);
    }

    function placeToken(tokenId, slot) {
      const token = tokenById(tokenId);
      if (!token) return;
      hasAttempted = true;

      if (token.slot !== slot) {
        shakeSlot = slot;
        els.feedback.className = "feedback error";
        els.feedback.textContent = `這個中文片段不是「${labelForSlot(slot)}」。再想一下：它在句子中負責什麼功能？`;
        analysisMessage = {
          type: "error",
          title: "中文拆解錯誤",
          text: `${token.text} 的功能是「${token.label}」，不是「${labelForSlot(slot)}」。先判斷它是句子主幹，還是時間、地點、執行者等細節。`
        };
        selectedTokenId = null;
        render();
        window.setTimeout(() => {
          if (shakeSlot === slot) shakeSlot = null;
          els.stageOne.querySelector(`[data-slot="${slot}"]`)?.classList.remove("shake");
        }, 360);
        return;
      }

      placements[slot] = token.id;
      selectedTokenId = null;
      analysisMessage = null;
      els.feedback.className = "feedback correct";
      els.feedback.textContent = `${token.text} 放到「${token.label}」正確。`;

      if (isStageOneDone()) {
        stage = Math.max(stage, 3);
        els.feedback.textContent = "中文主幹與細節完成。下一步請先確認時態與主被動。";
      }
      render();
    }

    function selectTense(id) {
      selectedTense = id;
      hasAttempted = true;
      if (id !== question().tense) {
        const correct = tenseById(question().tense);
        els.feedback.className = "feedback error";
        els.feedback.textContent = "時態還不對。請先看底下解析，再重新選擇。";
        analysisMessage = {
          type: "error",
          title: "時態判斷錯誤",
          text: `這題需要的是「${correct.label}」。理由：${question().tenseReason}`
        };
        render();
        return;
      }

      analysisMessage = {
        type: "correct",
        title: "時態正確",
        text: `${tenseById(id).label} 正確。接著確認這句英文要用主動還是被動。`
      };
      if (isDecisionDone()) stage = Math.max(stage, 4);
      els.feedback.className = "feedback correct";
      els.feedback.textContent = `時態正確：${tenseById(id).label}。`;
      render();
    }

    function selectVoice(id) {
      selectedVoice = id;
      hasAttempted = true;
      if (id !== question().voice) {
        els.feedback.className = "feedback error";
        els.feedback.textContent = "主被動還不對。請先看底下解析，再重新選擇。";
        analysisMessage = {
          type: "error",
          title: "主被動判斷錯誤",
          text: question().voiceReason
        };
      } else {
        analysisMessage = {
          type: "correct",
          title: "主被動正確",
          text: `${voiceById(id).label} 正確。${isDecisionDone() ? "現在可以開始組裝英文句子。" : "請再確認時態是否也正確。"}`
        };
        if (isDecisionDone()) stage = Math.max(stage, 4);
        els.feedback.className = "feedback correct";
        els.feedback.textContent = `語態正確：${voiceById(id).label}。`;
      }
      render();
    }

    function addPiece(id) {
      if (builtPieces.includes(id)) return;
      builtPieces.push(id);
      render();
    }

    function removePiece(id) {
      builtPieces = builtPieces.filter((pieceId) => pieceId !== id);
      render();
    }

    function clearBuiltPieces() {
      builtPieces = [];
      els.feedback.className = "feedback";
      els.feedback.textContent = "已清空英文組句，請重新排列。";
      analysisMessage = null;
      render();
    }

    function checkSentence() {
      hasAttempted = true;
      if (!isDecisionDone()) {
        els.feedback.className = "feedback error";
        els.feedback.textContent = "請先把時態與主被動都選正確，再檢查英文句子。";
        analysisMessage = {
          type: "error",
          title: "尚未完成文法決策",
          text: "第四階段只檢查英文片段順序。時態與主被動需要先在第三階段確認正確。"
        };
        render();
        return;
      }

      if (isSentenceDone()) {
        revealed = true;
        els.feedback.className = "feedback correct";
        els.feedback.textContent = `完成。${question().summary}`;
        analysisMessage = {
          type: "correct",
          title: "句子組裝正確",
          text: "固定片語與比較難的單字已解鎖，請在下方完成吸收。"
        };
      } else {
        els.feedback.className = "feedback error";
        els.feedback.textContent = "英文片段順序還需要調整。請先看底下解析。";
        analysisMessage = {
          type: "error",
          title: "英文組句順序錯誤",
          text: question().orderReason
        };
      }
      render();
    }

    function revealAll() {
      const data = question();
      if (!canRevealAnswer()) {
        shakeCurrentStage();
        els.feedback.className = "feedback";
        els.feedback.textContent = "先自己試做一次，卡住的話再按這裡看答案。";
        return;
      }

      highlightDone = true;
      data.core.forEach((token) => {
        placements[token.slot] = token.id;
      });
      data.details.forEach((token) => {
        placements[token.slot] = token.id;
      });
      selectedTense = data.tense;
      selectedVoice = data.voice;
      builtPieces = data.answerPieces.map((piece) => piece.id);
      // 進階模式的片語拆解：一般帳號只保留學生自己已經正確拼好的片語，
      // 沒做過的片語維持空白，逼他在進階模式自己做一次；
      // 特權／開發帳號則直接補滿，方便校對。
      const revealAllPhrases = DEV_ALWAYS_REVEAL || isPrivilegedUser();
      const builtBefore = new Set(
        data.answerPieces.filter(isPieceBuilt).map((piece) => piece.id)
      );
      phraseWordBuilds = {};
      data.answerPieces.forEach((piece) => {
        if (revealAllPhrases || builtBefore.has(piece.id)) {
          phraseWordBuilds[piece.id] = pieceWordTokens(piece).map((token) => token.id);
        }
      });
      stage = 4;
      revealed = true;
      analysisMessage = {
        type: "correct",
        title: "解答已揭露",
        text: revealAllPhrases
          ? "固定片語與比較難的單字已解鎖。"
          : "英文整句已顯示；進階模式的片語要自己正確做過一次才會出現。"
      };
      els.feedback.className = "feedback correct";
      els.feedback.textContent = `英文答案已顯示。${data.summary}`;
      render();
    }

    function render() {
      const data = question();
      const completed = completedStages();
      const tense = tenseById(data.tense);
      const voice = voiceById(data.voice);

      // 每次重繪都清掉殘留的單字中文卡，避免填入單字後中文一直卡在畫面上遮住其他句子。
      glossTip.hide();

      els.progressText.textContent = `${completed} / 4`;
      els.progressFill.style.width = `${Math.round((completed / 4) * 100)}%`;
      els.titleText.textContent = mobileLayout ? `${data.year} 年${data.title}` : `${data.year}｜${data.title}`;
      els.subtitleText.textContent = "主畫面先呈現中文題目，完成流程後才顯示英文答案。";
      els.chineseQuestionText.textContent = data.chinese;
      els.revealButton.disabled = !canRevealAnswer();
      els.revealButton.title = canRevealAnswer() ? "顯示這題的英文答案" : "完成作答流程後才能顯示英文答案";
      els.promptPanel.hidden = isHighlightDone() && !isStageOneDone() && !revealed;

      if (revealed) {
        els.promptTitle.textContent = "英文答案已顯示";
        els.promptBody.textContent = `${tense.label}，${voice.label}。`;
      } else if (stage === 1) {
        els.promptTitle.textContent = "第一階段：中文螢光筆";
        els.promptBody.textContent = "先自由標記你看到的主詞、動詞、受詞、連接詞與細節；這一段不評分。";
      } else if (stage === 2) {
        els.promptTitle.textContent = "第二階段：中文拆句";
        els.promptBody.textContent = "先放句首導入，再拆主幹；如果有兩個句子，就分成 A 句主幹與 B 句主幹。";
      } else if (stage === 3) {
        els.promptTitle.textContent = "第三階段：時態與主被動";
        els.promptBody.textContent = "先確認時態，再確認主動或被動；兩者都正確後才會解鎖英文組句。";
      } else if (practiceMode === "advanced" && !isPhraseStageDone(data)) {
        els.promptTitle.textContent = "第四階段：片語組字";
        els.promptBody.textContent = "先把每個較長片語的單字排成正確順序，全部完成後才解鎖整句組句。";
      } else {
        els.promptTitle.textContent = practiceMode === "advanced" ? "第五階段：英文組句" : "第四階段：英文組句";
        els.promptBody.textContent = "把英文片段排成完整句子。";
      }

      els.modeButton.textContent = practiceMode === "advanced" ? "進階模式：開" : "進階模式：關";
      // 開＝藍色（primary），關＝白色（預設）
      els.modeButton.classList.toggle("primary", practiceMode === "advanced");

      renderHighlightStage(data);
      renderStageBridge();
      renderStageOne(data);
      renderStageTwo(data);
      renderPhraseStage(data);
      renderStageThree(data);
      renderAnalysis();
      saveCurrentProgress();
      renderQuestionList();
      renderRewardPanel(data);
    }

    function setPanelInteraction(panel, enabled) {
      panel.toggleAttribute("inert", !enabled);
      panel.setAttribute("aria-disabled", enabled ? "false" : "true");
    }

    function renderStageBridge() {
      els.stageBridge.hidden = !(isHighlightDone() && !isStageOneDone() && !revealed);
    }

    function renderHighlightStage(data) {
      const locked = isHighlightDone();
      const chars = Array.from(data.chinese);
      els.stageHighlight.innerHTML = `
        <div class="stage-heading">
          <div>
            <h3>1. 中文螢光筆</h3>
            <p>用顏色標出你自己的初步判斷；這裡沒有對錯，完成後再進入正式拆句。</p>
          </div>
          <span class="stage-badge">${isHighlightDone() ? "完成" : "自由標記"}</span>
        </div>
        <div class="highlighter-tools">
          ${markerOptions.map((marker) => `
            <button
              class="marker-button ${marker.id === "erase" ? "erase-tool" : ""} ${selectedMarker === marker.id ? "active" : ""}"
              style="--marker-color: ${marker.color}"
              data-marker-id="${marker.id}"
              ${locked ? "disabled" : ""}
              type="button"
            >${marker.label}</button>
          `).join("")}
        </div>
        <div class="highlight-surface" id="highlightSurface" aria-label="中文螢光筆標記區">
          ${chars.map((char, index) => {
            const mark = highlightMarks[index] || "";
            const isSpace = /\s/.test(char);
            return `<button class="highlight-char ${mark}" data-char-index="${index}" ${locked || isSpace ? "disabled" : ""} type="button">${escapeHtml(char)}</button>`;
          }).join("")}
        </div>
        <div class="highlight-actions">
          <button class="btn ghost" id="clearHighlightButton" ${locked ? "disabled" : ""} type="button">清除標記</button>
          <button class="btn primary" id="finishHighlightButton" ${locked ? "disabled" : ""} type="button">完成分析</button>
        </div>
      `;

      if (locked) return;
      els.stageHighlight.querySelectorAll("[data-marker-id]").forEach((button) => {
        button.addEventListener("click", () => {
          selectedMarker = button.dataset.markerId;
          render();
        });
      });
      const surface = document.getElementById("highlightSurface");
      surface.addEventListener("pointermove", continueHighlightPaint);
      surface.addEventListener("pointerleave", stopHighlightPaint);
      els.stageHighlight.querySelectorAll("[data-char-index]").forEach((button) => {
        button.addEventListener("pointerdown", startHighlightPaint);
        button.addEventListener("pointerenter", continueHighlightPaint);
      });
      document.getElementById("clearHighlightButton").addEventListener("click", clearHighlights);
      document.getElementById("finishHighlightButton").addEventListener("click", finishHighlight);
    }

    function startHighlightPaint(event) {
      if (highlightDone) return;
      event.preventDefault();
      isHighlightPainting = true;
      event.currentTarget.releasePointerCapture(event.pointerId);
      applyHighlightMark(event.currentTarget);
      document.addEventListener("pointerup", stopHighlightPaint, { once: true });
    }

    function continueHighlightPaint(event) {
      if (!isHighlightPainting || highlightDone) return;
      event.preventDefault();
      const target = event.target.closest?.("[data-char-index]")
        || document.elementFromPoint(event.clientX, event.clientY)?.closest?.("[data-char-index]");
      applyHighlightMark(target);
    }

    function stopHighlightPaint() {
      if (!isHighlightPainting) return;
      isHighlightPainting = false;
      saveCurrentProgress();
    }

    function applyHighlightMark(charButton) {
      if (!charButton || charButton.disabled) return;
      const index = charButton.dataset.charIndex;
      if (highlightDone) return;
      if (selectedMarker === "erase") {
        delete highlightMarks[index];
      } else {
        highlightMarks[index] = selectedMarker;
      }
      markerOptions.forEach((marker) => {
        if (marker.id !== "erase") charButton.classList.remove(marker.id);
      });
      if (selectedMarker !== "erase") charButton.classList.add(selectedMarker);
    }

    function clearHighlights() {
      highlightMarks = {};
      analysisMessage = null;
      els.feedback.className = "feedback";
      els.feedback.textContent = "已清除螢光筆標記，可以重新分析這句中文。";
      render();
    }

    function finishHighlight() {
      highlightDone = true;
      stage = Math.max(stage, 2);
      analysisMessage = {
        type: "correct",
        title: "自由標記完成",
        text: "這一步沒有標準答案。接下來用系統提供的片段，正式確認句首導入、主幹、子句包、黏著修飾（adj / adv）與補充細節（adv phrase / prep + N）。"
      };
      els.feedback.className = "feedback correct";
      els.feedback.textContent = "中文螢光筆完成。下一步請正式拆出句首導入、主幹、子句包、黏著修飾（adj / adv）與補充細節（adv phrase / prep + N）。";
      render();
    }

    function renderSubclauses(data, position = "after-core") {
      // 子句包預設渲染在主幹之後；設 position: "before-core" 則放在句首導入與主幹之間（適合修飾句首名詞的形容詞子句）。
      const subclauses = (data.subclauses || []).filter((clause) => (clause.position || "after-core") === position);
      if (!subclauses.length) return "";
      return `
          <div>
            <p class="line-label">子句包（noun / adj clause）</p>
            <div class="clause-lane">
              ${subclauses.map((clause) => `
                <div class="clause-card">
                  <strong>${clause.type}${clause.role ? `｜${clause.role}` : ""}</strong>
                  <span>${clause.text}</span>
                  <div class="clause-meta">
                    ${[
                      clause.marker ? `引導詞：${clause.marker}` : "",
                      clause.target ? `修飾對象：${clause.target}` : "",
                      clause.core ? `子句主幹：${clause.core}` : "",
                      clause.note || ""
                    ].filter(Boolean).join("<br>")}
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
      `;
    }

    function renderStageOne(data) {
      const locked = !isHighlightDone();
      const structureLocked = isStageOneDone();
      const bank = data.bankOrder.map((id) => tokenById(id));
      const placedIds = Object.values(placements);
      const leadSlots = detailGroupSlots(data, "lead");
      const leadSlotSet = new Set(leadSlots);
      const boundSlots = detailGroupSlots(data, "bound");
      const supplementalSlots = detailGroupSlots(data, "supplemental");
      const coreGroups = data.coreGroups || [{ id: "main", label: "主幹", slots: ["subject", "verb", "object"] }];
      const leadLabel = hasMultipleCoreGroups(data) ? "句首導入 / 句間連接" : "句首導入 / 全句框架";

      els.stageOne.classList.toggle("locked", locked);
      setPanelInteraction(els.stageOne, !locked);
      els.stageOne.innerHTML = `
        <div class="stage-heading">
          <div>
            <h3>2. 中文結構拆分</h3>
            <p>先放句首導入，再放主幹；若有名詞子句或形容詞子句，就另外看子句包。</p>
          </div>
          <span class="stage-badge">${isStageOneDone() ? "完成" : locked ? "未解鎖" : "拖拉中"}</span>
        </div>
        <div class="structure-board">
          ${leadSlots.length ? `
          <div>
            <p class="line-label">${leadLabel}</p>
            <div class="detail-lane lead-lane">
              ${leadSlots.map((slot) => renderSlot(slot)).join("")}
            </div>
          </div>
          ` : ""}
          ${renderSubclauses(data, "before-core")}
          ${coreGroups.map((group) => {
            const connectors = data.details.filter((detail) => detail.group === "connector" && detail.beforeClause === group.id);
            const connectorMarkup = connectors.length ? `
          <div>
            <p class="line-label">子句連接（連接詞）</p>
            <div class="detail-lane connector-lane">
              ${connectors.map((detail) => renderSlot(detail.slot)).join("")}
            </div>
          </div>` : "";
            return `${connectorMarkup}
          <div>
            <p class="line-label">${group.label}</p>
            <div class="structure-lane">
              ${group.slots.map((slot) => renderSlot(slot)).join("")}
            </div>
          </div>`;
          }).join("")}
          ${renderSubclauses(data, "after-core")}
          <div>
            <p class="line-label">黏著修飾（adj / adv）</p>
            <div class="detail-lane">
              ${boundSlots.length ? boundSlots.map((slot) => renderSlot(slot)).join("") : `<div class="lane-empty">本題沒有需要獨立放的黏著修飾。</div>`}
            </div>
          </div>
          <div>
            <p class="line-label">補充細節（adv phrase / prep + N）</p>
            <div class="detail-lane">
              ${supplementalSlots.length ? supplementalSlots.map((slot) => renderSlot(slot)).join("") : `<div class="lane-empty">本題沒有額外的補充細節。</div>`}
            </div>
          </div>
        </div>
        <div>
          <p class="line-label">可拖拉中文片段</p>
          <div class="token-bank">
            ${bank.map((token) => `
              <button
                class="token ${token.role} ${leadSlotSet.has(token.slot) ? "lead" : ""} ${selectedTokenId === token.id ? "selected" : ""} ${placedIds.includes(token.id) ? "used" : ""}"
                draggable="${!locked && !structureLocked && !placedIds.includes(token.id)}"
                data-token-id="${token.id}"
                ${locked || structureLocked ? "disabled" : ""}
                type="button"
              >${token.text}</button>
            `).join("")}
          </div>
        </div>
      `;

      els.stageOne.querySelectorAll("[data-token-id]").forEach((button) => {
        if (locked || structureLocked) return;
        button.addEventListener("dragstart", (event) => {
          event.dataTransfer.setData("text/plain", button.dataset.tokenId);
        });
        button.addEventListener("click", () => {
          selectedTokenId = selectedTokenId === button.dataset.tokenId ? null : button.dataset.tokenId;
          render();
        });
      });

    function renderSlot(slot) {
      const tokenId = placements[slot];
      const token = tokenId ? tokenById(tokenId) : null;
      const expected = tokenForSlot(slot);
      const role = expected.role || slot;
      const shakeClass = shakeSlot === slot ? "shake" : "";
      return `
        <button class="slot ${role} ${token ? "filled" : ""} ${shakeClass}" data-slot="${slot}" ${!isHighlightDone() || isStageOneDone() ? "disabled" : ""} type="button">
          <span class="slot-label">${expected.label}</span>
          <span class="slot-content">${token ? token.text : `拖入「${expected.label}」`}</span>
        </button>
      `;

    function renderPhraseStage(data) {
      const advanced = practiceMode === "advanced";
      els.stagePhrase.hidden = !advanced;
      if (!advanced) {
        els.stagePhrase.innerHTML = "";
        return;
      }

      const locked = !isDecisionDone();
      els.stagePhrase.classList.toggle("locked", locked);
      setPanelInteraction(els.stagePhrase, !locked);

      const glossary = getGlossary(data);
      const pieces = buildablePieces(data);
      if (!pieces.length) {
        els.stagePhrase.innerHTML = `
          <div class="stage-heading">
            <div>
              <h3>4. 片語組字（進階）</h3>
              <p>這題沒有需要逐字重組的長片語，可直接進入英文組句。</p>
            </div>
            <span class="stage-badge">略過</span>
          </div>
        `;
        return;
      }

      const rows = pieces.map((piece) => {
        // 每個要重組的片語，最上面顯示「這一小句」的中文（整句中文已在最上面的固定 Title）。
        const zh = pieceChinese(piece, glossary);
        const zhLine = zh ? `<p class="piece-zh">${escapeHtml(zh)}</p>` : "";
        if (isPieceBuilt(piece)) {
          return `
            <div class="answer-box">
              ${zhLine}
              <span>片語完成</span>
              <strong>${glossifyText(piece.text, glossary)}</strong>
            </div>
          `;
        }
        const tokens = pieceWordTokens(piece);
        const placed = phraseWordBuilds[piece.id] || [];
        const usedIds = new Set(placed);
        const scrambled = seededShuffle(tokens, `${data.id}:${piece.id}`);
        return `
          <div class="builder-box">
            ${zhLine}
            <p class="line-label">把這 ${tokens.length} 個字排成正確片語</p>
            <div class="built-line">
              ${placed.length === 0
                ? `<span class="built-placeholder">點選下方單字，依序組成片語。</span>`
                : placed.map((id) => `<button class="token" data-word-remove="${id}" type="button">${glossifyText(wordTextById(piece, id), glossary)}</button>`).join("")}
            </div>
            <div class="sentence-bank">
              ${scrambled.map((token) => `<button class="token ${usedIds.has(token.id) ? "used" : ""}" data-word-add="${token.id}" type="button">${glossifyText(token.text, glossary)}</button>`).join("")}
            </div>
          </div>
        `;
      }).join("");

      els.stagePhrase.innerHTML = `

          <div>
            <h3>4. 片語組字（進階）</h3>

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    // 把 AI 小老師回答（第一行結論＋「・」開頭的條列）轉成 HTML，
    // 讓換行與重點清單能正確顯示，而不是被擠成一整行。
    function formatAiAnswer(text) {
      const bulletRe = /^[・·••\-\*]\s*/;
      const lines = String(text).split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
      let html = "";
      let inList = false;
      lines.forEach((line) => {
        if (bulletRe.test(line)) {
          if (!inList) { html += '<ul class="ai-bullets">'; inList = true; }
          html += `<li>${escapeHtml(line.replace(bulletRe, ""))}</li>`;
        } else {
          if (inList) { html += "</ul>"; inList = false; }
          html += `<p>${escapeHtml(line)}</p>`;
        }
      });
      if (inList) html += "</ul>";
      return html || escapeHtml(text);
    }
