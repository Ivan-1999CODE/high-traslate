      uphold: "維護、支持", urban: "都市的", used: "使用；習慣於", users: "使用者",
      using: "使用", variety: "多樣；種類", vegetables: "蔬菜", visiting: "拜訪、參觀",
      volunteers: "志工", war: "戰爭", workplace: "職場", world: "世界",
      worldwide: "全世界的", wrote: "寫（過去式）", year: "年", years: "年", young: "年輕的"
    };

    // 由本題的固定片語與單字表，建立「英文 → 中文」查詢表（長片語優先比對）。
    function getGlossary(data) {
      if (data.__glossary) return data.__glossary;
      const map = new Map();
      const add = (entry) => {
        if (!entry || !entry.text) return;
        const key = normalizeGlossKey(entry.text);
        if (!key || map.has(key)) return;
        map.set(key, { en: entry.text, zh: entry.meaning || "", note: entry.note || "" });
      };
      (data.phraseNotes || []).forEach(add);
      (data.vocabulary || []).forEach(add);
      const entries = [...map.entries()]
        .map(([key, value]) => ({ words: key.split(" "), value }))
        .sort((a, b) => b.words.length - a.words.length);
      data.__glossary = entries;
      return entries;
    }

    function glossSpan(display, en, zh, note) {
      return `<span class="glossable" data-gloss-en="${escapeHtml(en)}" data-gloss-zh="${escapeHtml(zh)}" data-gloss-note="${escapeHtml(note || "")}">${escapeHtml(display)}</span>`;
    }

    // 掃描英文字串：先比對本題的固定片語（長片語優先、整塊呈現），其餘單字再用全域單字表逐字補上。
    function glossifyText(text, glossary) {
      const raw = String(text);
      const chunks = raw.split(" ");
      const clean = chunks.map((chunk) => chunk.toLowerCase().replace(/[^a-z0-9'-]/g, ""));
      const out = [];
      let i = 0;
      while (i < chunks.length) {
        let match = null;
        if (glossary && glossary.length) {
          for (const entry of glossary) {
            const len = entry.words.length;
            if (i + len > chunks.length) continue;
            let ok = true;
            for (let j = 0; j < len; j++) {
              if (clean[i + j] !== entry.words[j]) { ok = false; break; }
            }
            if (ok) { match = { entry, len }; break; }
          }
        }
        if (match) {
          const segment = chunks.slice(i, i + match.len).join(" ");
          const value = match.entry.value;
          out.push(glossSpan(segment, value.en, value.zh, value.note));
          i += match.len;
          continue;
        }
        const word = clean[i];
        const zh = word && !GLOSS_STOPWORDS.has(word) ? WORD_GLOSS[word] : null;
        if (zh) {
          out.push(glossSpan(chunks[i], word, zh, ""));
        } else {
          out.push(escapeHtml(chunks[i]));
        }
        i += 1;
      }
      return out.join(" ");
    }

    const glossTip = (() => {
      let tip = null;
      function ensure() {
        if (!tip) {
          tip = document.createElement("div");
          tip.className = "gloss-tip";
          tip.hidden = true;
          document.body.appendChild(tip);
        }
        return tip;
      }
      function show(target) {
        const el = ensure();
        const note = target.dataset.glossNote || "";
        el.innerHTML = `
          <span class="gloss-en">${escapeHtml(target.dataset.glossEn || "")}</span>
          <span class="gloss-zh">${escapeHtml(target.dataset.glossZh || "")}</span>
          ${note ? `<span class="gloss-note">${escapeHtml(note)}</span>` : ""}
        `;
        el.hidden = false;
        const rect = target.getBoundingClientRect();
        const tipRect = el.getBoundingClientRect();
        const maxLeft = window.scrollX + document.documentElement.clientWidth - tipRect.width - 8;
        let left = window.scrollX + rect.left + rect.width / 2 - tipRect.width / 2;
        left = Math.max(window.scrollX + 8, Math.min(left, maxLeft));
        let top = window.scrollY + rect.top - tipRect.height - 8;
        if (top < window.scrollY + 4) top = window.scrollY + rect.bottom + 8;
        el.style.left = `${left}px`;
        el.style.top = `${top}px`;
      }
      function hide() {
        if (tip) tip.hidden = true;
      }
      return { show, hide };
    })();

    window.addEventListener("scroll", () => glossTip.hide(), { passive: true });
    window.addEventListener("resize", () => glossTip.hide());

    // 只有真正支援 hover 的滑鼠裝置才用 hover 顯示翻譯；觸控裝置（平板／手機）一律靠長按，
    // 短按＝token 原本的「放進句子」動作。這樣可避免平板上點一下就誤觸 hover、中文卡住不消失。
    const SUPPORTS_HOVER = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
    function bindGloss(container) {
      if (!container) return;
      container.querySelectorAll(".glossable").forEach((span) => {
        if (SUPPORTS_HOVER) {
          span.addEventListener("mouseenter", () => glossTip.show(span));
          span.addEventListener("mouseleave", () => glossTip.hide());
        }
        let timer = null;
        let longPress = false;
        span.addEventListener("touchstart", () => {
          longPress = false;
          glossTip.hide();
          timer = window.setTimeout(() => {
            longPress = true;
            glossTip.show(span);
          }, 350);
        }, { passive: true });
        span.addEventListener("touchmove", () => {
          window.clearTimeout(timer);
        }, { passive: true });
        span.addEventListener("touchend", (event) => {
          window.clearTimeout(timer);
          if (longPress) {
            // 長按：只顯示解釋，攔掉後續 click，不要把單字填進句子。
            event.preventDefault();
            event.stopPropagation();
            window.setTimeout(() => glossTip.hide(), 1600);
          }
          // 短按：不攔截，讓 click 冒泡到 token，照常填入單字（中文卡會在重繪時清掉）。
        });
      });
    }

    function generateAiAnswer(rawQuestion, data) {
      const query = rawQuestion.trim().toLowerCase();
      const phrases = data.phraseNotes.map((item) => `${item.text}：${item.meaning}`).join("；");
      const vocab = data.vocabulary.map((item) => `${item.text}：${item.meaning}`).join("；");

      if (!query) return "可以問：為什麼用這個時態？這句怎麼排序？有哪些固定片語？有哪些可替換單字？";
      if (query.includes("時態") || query.includes("tense") || query.includes("為什麼")) return data.tenseReason;
      if (query.includes("主被動") || query.includes("被動") || query.includes("語態") || query.includes("voice")) return data.voiceReason;
      if (query.includes("順序") || query.includes("排序") || query.includes("組句") || query.includes("order")) return data.orderReason;
      if (query.includes("片語") || query.includes("固定") || query.includes("phrase")) return phrases || "這題沒有額外固定片語。";
      if (query.includes("單字") || query.includes("替換") || query.includes("vocab") || query.includes("word")) return vocab || "這題沒有額外列出可替換單字。";
      if (query.includes("答案") || query.includes("英文") || query.includes("answer")) return data.answer;
      return `${data.summary} 你也可以問我「時態」、「主被動」、「組句順序」、「固定片語」或「可替換單字」。`;
    }

    function aiTutorEnabled() {
      return Boolean(AI_TUTOR_CONFIG.useAi);
    }

    // 呼叫自家後端代理 /api/tutor（key 藏在 Cloudflare 環境變數），回傳 AI 的繁體中文解說。
    async function askAiTutor(userQuestion, data) {
      const context = [
        `中文題目：${data.chinese}`,
        `參考英文答案：${data.answer}`,
        `時態：${tenseById(data.tense)?.label || ""}；語態：${voiceById(data.voice)?.label || ""}`,
        `時態原因：${data.tenseReason}`,
        `語態原因：${data.voiceReason}`,
        `組句順序原因：${data.orderReason}`,
        `固定片語：${data.phraseNotes.map((p) => `${p.text}（${p.meaning}）`).join("、") || "無"}`,
        `可替換單字：${data.vocabulary.map((v) => `${v.text}（${v.meaning}）`).join("、") || "無"}`
      ].join("\n");

      const res = await fetch(AI_TUTOR_CONFIG.endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: userQuestion, context })
      });
      if (!res.ok) {
        const detail = await res.text().catch(() => "");
        throw new Error(`AI 代理 ${res.status}：${detail}`);
      }
      const json = await res.json();
      const text = ((json && json.answer) || "").trim();
      if (!text) throw new Error("AI 代理回傳空白內容");
      return text;
    }

    function renderRewardPanel(data) {
      if (!revealed) {
        els.hintText.innerHTML = hintMessage
          ? `<p>${escapeHtml(hintMessage)}</p>`
          : `<p>答題完成後，這裡會解鎖本題關鍵、固定片語、可替換單字與 AI 小老師問答。</p>`;
        return;
      }

      const phraseItems = data.phraseNotes.length
        ? data.phraseNotes.map((item) => `<li><strong>${item.text}</strong>：${item.meaning}。${item.note}</li>`).join("")
        : "<li>這題沒有額外固定片語。</li>";
      const vocabItems = data.vocabulary.length
        ? data.vocabulary.map((item) => `<li><strong>${item.text}</strong>：${item.meaning}。${item.note}</li>`).join("")
        : "<li>這題沒有額外可替換單字。</li>";

      els.hintText.innerHTML = `
        <div class="reward-key">
          <h4>本題關鍵</h4>
          <p class="reward-summary">${data.summary}</p>
          <div class="key-grid">
            <div class="key-item"><span class="key-tag">時態</span><p>${data.tenseReason}</p></div>
            <div class="key-item"><span class="key-tag">主被動</span><p>${data.voiceReason}</p></div>
            <div class="key-item"><span class="key-tag">組句順序</span><p>${data.orderReason}</p></div>
          </div>
        </div>
        <div class="learning-card">
          <h4>固定片語</h4>
          <ul>${phraseItems}</ul>
        </div>
        <div class="learning-card">
          <h4>可替換單字</h4>
          <ul>${vocabItems}</ul>
        </div>
        <div class="ai-box">
          <h4>AI 小老師</h4>
          <div class="ai-row">
            <input class="ai-input" id="aiQuestionInput" type="text" placeholder="問：為什麼用這個時態？">
            <button class="btn primary" id="aiAskButton" type="button">送出</button>
          </div>
          <div class="ai-answer" id="aiAnswer">可以問本題的時態、主被動、組句順序、固定片語或可替換單字。</div>
        </div>
      `;
      bindRewardAiEvents(data);
    }

    function bindRewardAiEvents(data) {
      const input = document.getElementById("aiQuestionInput");
      const button = document.getElementById("aiAskButton");
      const answer = document.getElementById("aiAnswer");
      if (!input || !button || !answer) return;

      const renderQa = (userQuestion, label, answerText) => {
        answer.innerHTML = `<div class="ai-qa-question"><strong>你問：</strong>${escapeHtml(userQuestion || "請給我提示")}</div><div class="ai-qa-answer"><strong>${label}：</strong>${formatAiAnswer(answerText)}</div>`;
      };

      const ask = async () => {
        const userQuestion = input.value.trim();

        // 沒設定 API Key → 沿用內建關鍵字回答（離線、免費）
        if (!aiTutorEnabled()) {
          renderQa(userQuestion, "AI 小老師", generateAiAnswer(userQuestion, data));
          return;
        }

        // 有設定 API Key → 呼叫 Gemini，失敗時自動退回內建回答
        renderQa(userQuestion, "AI 小老師", "思考中…");
        button.disabled = true;
        try {
          const aiText = await askAiTutor(userQuestion || "請給我這題的提示", data);
          renderQa(userQuestion, "AI 小老師", aiText);
        } catch (error) {
          console.warn("Gemini 問答失敗，改用內建回答。", error);
          renderQa(userQuestion, "AI 小老師（離線備援）", generateAiAnswer(userQuestion, data));
        } finally {
          button.disabled = false;
        }
      };

      button.addEventListener("click", ask);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") ask();
      });
    }

    function renderQuestionList() {
      const years = [...new Set(questions.map((item) => item.year))].sort(sortYearGroup);
      const savedQuestions = readSavedProgress().questions;
      els.drawerSummary.textContent = `已展開 ${years.length} 個年份、${questions.length} 題`;
      els.questionList.innerHTML = years.map((year) => {
        const items = questions
          .filter((item) => item.year === year)
          .sort((a, b) => questionSortKey(a) - questionSortKey(b));
        return `
          <div class="year-group">
            <p class="year-title">${year}</p>
            ${items.map((item) => {
              const index = questions.indexOf(item);
              const completed = Boolean(savedQuestions[item.id]?.completed);
              return `
                <button class="question-card ${index === questionIndex ? "active" : ""} ${completed ? "completed" : ""}" data-question-index="${index}" type="button">
                  <strong>${item.title}</strong>
                  <p>${item.chinese}</p>
                  ${completed ? `<div class="tag-row"><span class="tag">已完成</span></div>` : ""}
                </button>
              `;
            }).join("")}
          </div>
        `;
      }).join("");

      els.questionList.querySelectorAll("[data-question-index]").forEach((button) => {
        button.addEventListener("click", () => selectQuestion(Number(button.dataset.questionIndex)));
      });
    }

    function questionSortKey(item) {
      const match = item.id.match(/^exam-\d+-(\d+)$/);
      return match ? Number(match[1]) : 0;
    }

    function sortYearGroup(a, b) {
      const aIsExamYear = a < 200;
      const bIsExamYear = b < 200;
      if (aIsExamYear !== bIsExamYear) return aIsExamYear ? -1 : 1;
      return b - a;
    }

    els.authButton.addEventListener("click", toggleGoogleSignIn);
    els.resetButton.addEventListener("click", resetQuestion);
    els.revealButton.addEventListener("click", revealAll);
    els.modeButton.addEventListener("click", togglePracticeMode);

    // 響應式版面：桌機把模式／操作／登入鈕全部放回頂部 top bar（維持原本畫面）；
    // 手機／平板則把操作鈕搬到上方獨立列、登入鈕搬到側欄標題右上角。
    // 「進階模式」開關不論版面都留在固定抬頭的 top bar（topMode）裡，
    // 手機／平板捲動時會跟著題目標題一起被釘在上方，比較明顯。
    // 元素只有一份，用 appendChild 在兩種版面間搬移，ID 與事件都不變。
    const layoutMq = window.matchMedia("(max-width: 1180px)");
    function applyResponsiveLayout() {
      mobileLayout = layoutMq.matches;
      const actionBar = document.getElementById("actionBar");
      document.getElementById("topMode").appendChild(els.modeButton);
      if (mobileLayout) {
        const right = document.getElementById("actionBarActions");
        right.appendChild(els.resetButton);
        right.appendChild(els.revealButton);
        const auth = document.getElementById("brandAuthSlot");
        auth.appendChild(els.authButton);
        auth.appendChild(els.authStatus);
        actionBar.hidden = false;
      } else {
        const actions = document.getElementById("topActions");
        actions.appendChild(els.resetButton);
        actions.appendChild(els.revealButton);
        actions.appendChild(els.authButton);
        actions.appendChild(els.authStatus);
        actionBar.hidden = true;
      }
    }
    layoutMq.addEventListener("change", () => {
      applyResponsiveLayout();
      render();
    });
    applyResponsiveLayout();

    // 歷屆題目清單可收合：手機／平板預設收起，省下垂直空間。
    if (els.drawerToggle) {
      const setDrawerCollapsed = (collapsed) => {
        els.questionDrawer.classList.toggle("collapsed", collapsed);
        els.drawerToggle.setAttribute("aria-expanded", String(!collapsed));
      };
      if (window.matchMedia("(max-width: 1180px)").matches) setDrawerCollapsed(true);
      els.drawerToggle.addEventListener("click", () => {
        setDrawerCollapsed(!els.questionDrawer.classList.contains("collapsed"));
      });
    }

    let firebaseProgressSyncedUid = null;

    async function syncFirebaseProgress(backend) {
      if (!backend?.enabled) return;
      if (firebaseProgressSyncedUid === backend.uid) return;
      firebaseProgressSyncedUid = backend.uid;

      try {
        document.documentElement.dataset.firebaseProgressLoad = "loading";
        delete document.documentElement.dataset.firebaseProgressLoadError;
        const remoteStore = await backend.loadStore();
        document.documentElement.dataset.firebaseProgressLoad = "loaded";
        if (remoteStore) {
          applyRemoteProgressStore(remoteStore);
        } else {
          scheduleCloudProgressSave(readSavedProgress());
        }
      } catch (error) {
        document.documentElement.dataset.firebaseProgressLoad = "error";
        document.documentElement.dataset.firebaseProgressLoadError = error?.message || String(error);
        console.warn("Firebase progress load failed. Local progress is still available.", error);
      }
    }

    document.addEventListener("practice-progress-backend-ready", async (event) => {
      renderAuthState(event.detail?.backend);
      syncFirebaseProgress(event.detail?.backend);
    });

    document.addEventListener("practice-progress-auth-changed", async (event) => {
      renderAuthState(event.detail?.backend);
      render();
      syncFirebaseProgress(event.detail?.backend);
    });

    restoreQuestionState();
    render();
    renderAuthState(window.practiceProgressBackend);
    window.setTimeout(() => {
      renderAuthState(window.practiceProgressBackend);
      syncFirebaseProgress(window.practiceProgressBackend);
    }, 0);
</script>
