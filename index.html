        // --- 常見連接詞/轉折詞/介系詞列表 (簡易模式用) ---
        const COMMON_CONNECTORS = new Set([
            "although", "however", "but", "and", "so", "because", "therefore", "if", "when", "while", "since", "after", "before",

        // --- 工具函式 ---
        const shuffleArray = (array) => {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        };

        const speakText = (text) => {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        };

        const escapeRegExp = (text) => text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

        const makeBlankSentence = (sentence, word) => {
            const pattern = new RegExp(`\\b${escapeRegExp(word)}\\b`, 'i');
            if (!pattern.test(sentence)) return sentence;
            return sentence.replace(pattern, '____');
        };

        // --- AI API 呼叫函式 ---
        const callGeminiChat = async (userQuestion, contextItem) => {
            // -------------------------------------------------------------------------
            // AI 設定：正式給學生使用時，請填入自己的後端 / serverless endpoint。
            // 不要把 Google Gemini API Key 直接放在這個 HTML，學生瀏覽器會看得到。
            // endpoint 建議接收 { question, item }，回傳 { text: "..." }。
            // -------------------------------------------------------------------------
            const AI_PROXY_ENDPOINT = ""; // 例：https://your-domain.com/api/ai-teacher

            // 建構 Prompt，包含當前題目的完整資訊
            const contextPrompt = `
            你是一位親切、專業的英文老師，正在教導一位台灣學生。
            
            目前正在討論的題目如下：
            - 英文句子: "${contextItem.sentence}"
            - 中文翻譯: "${contextItem.sentence_ch}"
            - 重點單字: "${contextItem.word}" (${contextItem.part}, ${contextItem.chinese})

            學生的問題是： "${userQuestion}"

            請根據上述「當前句子」的情境來回答學生的問題。
            如果是問同義詞，請給出適合這句語境的同義詞。
            如果是問改寫，請示範如何改寫這句話。
            如果是問文法，請解釋這句話的文法結構。
            
            回答請用繁體中文，語氣鼓勵且簡潔，長度不要太長。
            
            **重要規則：請給出「純文字」的回答，絕對不要使用任何 Markdown 格式（例如：不要用 **粗體**，不要用 # 標題，不要用 * 列表），因為這些符號會讓學生閱讀困難。請直接分段或用空格排版即可。**
        `;

            if (!AI_PROXY_ENDPOINT) {
                return "AI 老師尚未啟用。之後請把 Google API Key 放在後端或 serverless function，再把這裡的 AI_PROXY_ENDPOINT 設成你的後端網址。不要把 API Key 直接貼在 HTML 裡。";
            }

            try {
                const response = await fetch(
                    AI_PROXY_ENDPOINT,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            question: userQuestion,
                            item: contextItem,
                            prompt: contextPrompt
                        })
                    }
                );

                if (!response.ok) {
                    const errorData = await response.json();
                    console.error("Gemini API Error Detail:", errorData);

                    // 判斷是否為常見錯誤
                    if (errorData.error && errorData.error.status === "PERMISSION_DENIED") {
                        return "存取被拒絕。請檢查後端的 API Key 或網域限制設定。";
                    }
                    if (errorData.error && errorData.error.status === "INVALID_ARGUMENT") {

                    }

                    return `發生錯誤 (代碼 ${response.status})。請查看 Console 了解詳情。`;
                }

                const data = await response.json();
                return data.text || data.candidates?.[0]?.content?.parts?.[0]?.text || "抱歉，我沒有聽清楚。";

            } catch (error) {
                console.error("Fetch Error:", error);
                return "連線發生錯誤，請檢查網路連線或 AI 後端 endpoint。";

                                <div key={item.id} className="bg-white p-4 rounded-2xl border-b-4 border-slate-200 flex flex-col gap-2 hover:translate-x-1 transition-all group relative hover:border-sky-300 hover:shadow-md cursor-pointer" onClick={() => setCurrentIndex(index)}>

                                            <Volume2 className="w-5 h-5" />

                                    <div className="flex justify-between items-end border-t border-slate-100 pt-2">
                                        <div className="text-slate-500 text-sm sm:text-base font-bold">{item.sentence_ch}</div>
                                        <button
                                            onClick={(e) => { e.stopPropagation(); setCurrentIndex(index); setShowTips(true); }}
                                            className="p-2 bg-yellow-100 text-yellow-600 rounded-lg hover:bg-yellow-200"
                                            title="問老師"

                    )}

            );
        };

        // --- 元件 2: 測驗模式 (重點單字測驗) ---
        const QuizMode = ({ data }) => {
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [showResult, setShowResult] = useState(false);
            const [quizData, setQuizData] = useState([]);
            const [selectedOption, setSelectedOption] = useState(null);

            useEffect(() => {
                startQuiz();
            }, [data]);

            const startQuiz = () => {
                const shuffledVocab = shuffleArray([...data]).slice(0, 10);
                const questions = shuffledVocab.map(target => {
                    const type = Math.random() > 0.5 ? 'en-to-ch' : 'ch-to-en';
                    const distractors = shuffleArray(data.filter(w => w.id !== target.id)).slice(0, 3);
                    const options = shuffleArray([target, ...distractors]);
                    return { target, type, options };
                });
                setQuizData(questions);
                setCurrentQIndex(0);
                setScore(0);
                setShowResult(false);
                setSelectedOption(null);
            };

            const handleOptionClick = (option) => {
                if (selectedOption) return;
                setSelectedOption(option);
                const currentQ = quizData[currentQIndex];

                speakText(currentQ.target.word);

                if (option.id === currentQ.target.id) {
                    setScore(prev => prev + 10);
                }
            };

            const nextQuestion = () => {
                if (currentQIndex < quizData.length - 1) {
                    setCurrentQIndex(prev => prev + 1);
                    setSelectedOption(null);
                } else {
                    setShowResult(true);
                }
            };

            if (quizData.length === 0) return <div>Loading...</div>;

            if (showResult) {
                return (
                    <div className="flex flex-col items-center justify-center h-full animate-in zoom-in py-10">

                            <Trophy className="w-32 h-32 text-yellow-400 drop-shadow-xl animate-bounce" strokeWidth={1.5} />
                            <Star className="absolute top-0 right-0 w-10 h-10 text-orange-400 fill-orange-400 animate-spin-slow" />
                        </div>
                        <h2 className="text-4xl font-black text-slate-800 mb-2 mt-4 text-stroke-white">單字挑戰完成！</h2>
                        <div className="text-7xl font-black text-transparent bg-clip-text bg-gradient-to-b from-yellow-400 to-orange-500 drop-shadow-sm mb-8">{score}</div>
                        <GameButton onClick={startQuiz} color="green" className="w-64 text-xl py-4">
                            再挑戰一次

            const currentQ = quizData[currentQIndex];
            const isEnToCh = currentQ.type === 'en-to-ch';

            return (
                <div className="flex flex-col h-full max-w-md sm:max-w-lg mx-auto">

                        <div className="bg-yellow-100 border-2 border-yellow-300 px-3 py-1 rounded-full font-black text-yellow-700 text-xs shadow-sm">

                    </div>

                    <div className="h-4 bg-slate-200 rounded-full overflow-hidden border-2 border-slate-300 mb-6 mx-1">
                        <div className="h-full bg-gradient-to-r from-lime-400 to-emerald-500 transition-all duration-300 border-r-2 border-white/50" style={{ width: `${((currentQIndex + 1) / quizData.length) * 100}%` }}></div>

                    <div className="bg-white border-4 border-b-8 border-violet-200 rounded-3xl p-6 mb-6 text-center relative overflow-hidden shadow-sm group">
                        <div className="absolute top-3 left-1/2 -translate-x-1/2 bg-violet-100 text-violet-600 px-3 py-1 rounded-lg text-xs font-black uppercase tracking-wider">

                        </div>
                        <h2 className={`font-black text-slate-800 mt-6 text-3xl sm:text-4xl leading-relaxed`}>

                        {isEnToCh && (
                            <button onClick={() => speakText(currentQ.target.word)} className="mt-4 p-2 bg-slate-100 rounded-full text-slate-400 hover:text-violet-500 hover:bg-violet-50 border-2 border-slate-200 hover:border-violet-200 transition-colors">

                    <div className="grid grid-cols-1 gap-3 pb-8">

                            const isSelected = selectedOption?.id === option.id;

                            if (selectedOption) {
                                if (isTarget) color = "green";
                                else if (isSelected && !isTarget) color = "red";

                            return (
                                <GameButton
                                    key={option.id}
                                    disabled={!!selectedOption}

                            <button onClick={nextQuestion} className="pointer-events-auto bg-slate-800 text-white px-8 py-4 rounded-2xl font-black text-xl shadow-2xl hover:bg-slate-900 hover:scale-105 transition-all flex items-center gap-2 animate-in slide-in-from-bottom-4 border-b-8 border-black">
                                {currentQIndex < quizData.length - 1 ? "NEXT STAGE" : "FINISH"} <ChevronRight className="w-6 h-6" />
                            </button>

                </div>

        };

        // --- 元件 3: 填空問答模式 (把單字放回句子語境) ---
        const FillBlankMode = ({ data }) => {
            const [questions, setQuestions] = useState([]);
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [showResult, setShowResult] = useState(false);

            useEffect(() => {
                startFillQuiz();
            }, [data]);

            const buildOptions = (target) => {
                const samePart = data.filter(item => item.id !== target.id && item.part === target.part);
                const fallback = data.filter(item => item.id !== target.id && item.part !== target.part);
                const picked = [];
                [...shuffleArray(samePart), ...shuffleArray(fallback)].forEach(item => {
                    if (picked.length < 3 && !picked.some(option => option.word === item.word)) {
                        picked.push(item);
                    }
                });
                return shuffleArray([target, ...picked]);
            };

            const startFillQuiz = () => {
                const usableItems = data.filter(item => makeBlankSentence(item.sentence, item.word) !== item.sentence);
                const sourceItems = usableItems.length > 0 ? usableItems : data;
                const nextQuestions = shuffleArray([...sourceItems]).slice(0, 10).map(target => ({
                    target,
                    blankSentence: makeBlankSentence(target.sentence, target.word),
                    options: buildOptions(target)
                }));
                setQuestions(nextQuestions);
                setCurrentQIndex(0);
                setScore(0);
                setSelectedOption(null);
                setShowResult(false);
            };

            const handleOptionClick = (option) => {
                if (selectedOption) return;
                setSelectedOption(option);
                speakText(option.word);
                if (option.id === questions[currentQIndex].target.id) {
                    setScore(prev => prev + 10);
                }
            };

            const nextQuestion = () => {
                if (currentQIndex < questions.length - 1) {
                    setCurrentQIndex(prev => prev + 1);
                    setSelectedOption(null);
                } else {
                    setShowResult(true);
                }
            };

            const renderBlankSentence = (text, answerText = null) => {
                const parts = text.split('____');
                if (parts.length === 1) return text;
                return (
                    <>
                        {parts[0]}
                        <span className={`inline-flex min-w-24 sm:min-w-32 h-9 mx-1 px-4 rounded-xl border-4 align-middle items-center justify-center font-black ${answerText ? 'border-emerald-400 bg-emerald-100 text-emerald-700' : 'border-dashed border-emerald-300 bg-emerald-50 text-emerald-600'}`}>
                            {answerText || '?'}
                        </span>
                        {parts.slice(1).join('____')}
                    </>
                );
            };

            if (questions.length === 0) return <div>Loading...</div>;

            if (showResult) {
                return (
                    <div className="flex flex-col items-center justify-center h-full animate-in zoom-in py-10">
                        <div className="relative">
                            <Star className="w-32 h-32 text-yellow-400 fill-yellow-400 drop-shadow-xl animate-bounce" />
                            <CheckCircle className="absolute -right-2 bottom-2 w-12 h-12 text-emerald-500 bg-white rounded-full p-1 border-4 border-emerald-100" />
                        </div>
                        <h2 className="text-4xl font-black text-slate-800 mb-2 mt-4">填空完成！</h2>
                        <div className="text-7xl font-black text-transparent bg-clip-text bg-gradient-to-b from-emerald-400 to-sky-500 drop-shadow-sm mb-8">{score}</div>
                        <GameButton onClick={startFillQuiz} color="green" className="w-64 text-xl py-4">
                            再練一次
                        </GameButton>
                    </div>
                );
            }

            const currentQ = questions[currentQIndex];

            return (
                <div className="flex flex-col h-full max-w-md sm:max-w-2xl mx-auto pb-20">
                    <div className="mb-4 px-1 flex items-center justify-between">
                        <div className="bg-white border-2 border-slate-200 px-3 py-1 rounded-full font-black text-slate-400 text-xs shadow-sm">
                            BLANK {currentQIndex + 1} / {questions.length}
                        </div>
                        <div className="bg-emerald-100 border-2 border-emerald-300 px-3 py-1 rounded-full font-black text-emerald-700 text-xs shadow-sm">
                            SCORE: {score}
                        </div>
                    </div>

                    <div className="h-4 bg-slate-200 rounded-full overflow-hidden border-2 border-slate-300 mb-6 mx-1">
                        <div className="h-full bg-gradient-to-r from-emerald-400 to-sky-500 transition-all duration-300 border-r-2 border-white/50" style={{ width: `${((currentQIndex + 1) / questions.length) * 100}%` }}></div>
                    </div>

                    <div className="bg-white border-4 border-b-8 border-emerald-200 rounded-3xl p-5 sm:p-6 mb-5 text-center relative shadow-sm">
                        <div className="inline-block bg-emerald-100 text-emerald-700 font-black px-3 py-1 rounded-lg text-xs border-2 border-emerald-200 mb-4">
                            句中填空
                        </div>
                        <h2 className="font-black text-xl sm:text-2xl text-slate-800 mb-4 leading-relaxed">
                            {currentQ.target.sentence_ch}
                        </h2>
                        <div className="bg-slate-50 border-2 border-slate-100 rounded-2xl px-4 py-5 text-lg sm:text-xl font-black text-slate-700 leading-relaxed">
                            {renderBlankSentence(currentQ.blankSentence, selectedOption ? currentQ.target.word : null)}
                        </div>
                        <button onClick={() => speakText(currentQ.target.sentence)} className="mt-4 p-2 bg-slate-100 rounded-full text-slate-400 hover:text-emerald-500 hover:bg-emerald-50 border-2 border-slate-200 hover:border-emerald-200 transition-colors">
                            <Volume2 className="w-5 h-5 mx-auto" />
                        </button>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5">
                        {currentQ.options.map((option) => {
                            const isSelected = selectedOption?.id === option.id;
                            const isTarget = currentQ.target.id === option.id;
                            let color = "white";
                            if (selectedOption) {
                                if (isTarget) color = "green";
                                else if (isSelected && !isTarget) color = "red";
                            }

                            return (
                                <GameButton
                                    key={option.id}
                                    disabled={!!selectedOption}
                                    onClick={() => handleOptionClick(option)}
                                    color={color}
                                    className="justify-between py-4 px-5 text-left"
                                >
                                    <span className="flex flex-col items-start leading-tight">
                                        <span className="text-lg sm:text-xl font-black">{option.word}</span>
                                        <span className="text-xs opacity-70 font-bold mt-1">{option.chinese}</span>
                                    </span>
                                    {selectedOption && isTarget && <CheckCircle className="w-6 h-6 animate-bounce" />}
                                    {selectedOption && isSelected && !isTarget && <XCircle className="w-6 h-6 animate-pulse" />}
                                </GameButton>
                            );
                        })}
                    </div>

                    {selectedOption && (
                        <div className={`border-4 rounded-3xl p-4 shadow-sm mb-5 ${selectedOption.id === currentQ.target.id ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-rose-50 border-rose-200 text-rose-800'}`}>
                            <div className="flex items-start gap-2 font-black">
                                {selectedOption.id === currentQ.target.id ? <CheckCircle className="w-6 h-6 shrink-0" /> : <XCircle className="w-6 h-6 shrink-0" />}
                                <div>
                                    <p>{selectedOption.id === currentQ.target.id ? '答對了！' : `這題要選 ${currentQ.target.word}。`}</p>
                                    <p className="text-sm font-bold opacity-80 mt-1">完整句：{currentQ.target.sentence}</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {selectedOption && (
                        <GameButton onClick={nextQuestion} color="blue" className="py-4 text-lg justify-center">
                            {currentQIndex < questions.length - 1 ? "下一題" : "完成"} <ChevronRight className="w-5 h-5" />
                        </GameButton>
                    )}
                </div>
            );
        };

        // --- 元件 4: 重組句子模式 (完整句子 - 支援分級制度) ---
        const ScrambleMode = ({ data }) => {
            const [questions, setQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [showResult, setShowResult] = useState(false);

            // Difficulty: 'easy' (hints), 'medium' (grids), 'hard' (none)
            const [difficulty, setDifficulty] = useState('easy');

            // slots: Array of { id, text, status: 'locked' | 'filled' | 'empty' }
            const [slots, setSlots] = useState([]);
            const [availableWords, setAvailableWords] = useState([]);

            const [feedback, setFeedback] = useState(null);
            const [showGiveUpConfirm, setShowGiveUpConfirm] = useState(false);
            const [showHelperHint, setShowHelperHint] = useState(false);
            const [showTips, setShowTips] = useState(false); // 控制問答視窗

            // 1. 初始化遊戲 (只有當資料源改變時才重置)
            useEffect(() => {
                resetGame();
            }, [data]);

            // 2. 難度改變時，重新載入當前題目 (保持在同一題)
            useEffect(() => {
                if (questions.length > 0) {
                    // 重置當前題目的狀態 (slots, feedback etc)
                    loadQuestion(questions[currentIndex]);
                }
            }, [difficulty]);

            const resetGame = () => {
                const count = Math.min(data.length, 5);
                const shuffledQuestions = shuffleArray([...data]).slice(0, count);
                setQuestions(shuffledQuestions);
                setCurrentIndex(0);
                setScore(0);
                setShowResult(false);
                setShowTips(false);
                loadQuestion(shuffledQuestions[0]);
            };

            const isEasyLockWord = (word) => {
                const cleanWord = word.toLowerCase().replace(/[^a-z]/g, '');
                if (/^[.,!?;:]+$/.test(word)) return true;
                if (COMMON_CONNECTORS.has(cleanWord)) return true;
                return false;
            };

            const isMediumLockWord = (word) => {
                if (/^[.,!?;:]+$/.test(word)) return true;
                return false;
            };

            const loadQuestion = (question) => {
                if (!question) return;
                const rawSentence = question.sentence;
                const spacedSentence = rawSentence.replace(/([.,!?])/g, ' $1 ');
                const tokens = spacedSentence.trim().split(/\s+/).filter(w => w.length > 0);

                const newSlots = [];
                const newAvailable = [];

                tokens.forEach((word, index) => {
                    const id = `${index}-${word}`;
                    const wordObj = { id, text: word };

                    let shouldLock = false;

                    if (difficulty === 'easy') {
                        shouldLock = isEasyLockWord(word);
                    } else if (difficulty === 'medium') {
                        shouldLock = isMediumLockWord(word);
                    } else {
                        shouldLock = false;
                    }

                    if (shouldLock) {
                        newSlots.push({ ...wordObj, status: 'locked' });
                    } else {
                        newSlots.push({ id: `slot-${index}`, status: 'empty' });
                        newAvailable.push(wordObj);
                    }
                });

                if (difficulty === 'hard') {
                    setSlots([]);
                } else {
                    setSlots(newSlots);
                }

                setAvailableWords(shuffleArray(newAvailable));
                setFeedback(null);
                setShowGiveUpConfirm(false);
                setShowHelperHint(false);
            };

            const handleChangeQuestion = () => {
                const currentQuestionIds = new Set(questions.map(q => q.id));
                const candidates = data.filter(q => !currentQuestionIds.has(q.id));

                if (candidates.length === 0) {
                    const otherCandidates = data.filter(q => q.id !== questions[currentIndex].id);
                    if (otherCandidates.length > 0) {
                        const fallback = otherCandidates[Math.floor(Math.random() * otherCandidates.length)];
                        const newQs = [...questions];
                        newQs[currentIndex] = fallback;
                        setQuestions(newQs);
                        loadQuestion(fallback);
                    }
                    return;
                }

                const newQuestion = candidates[Math.floor(Math.random() * candidates.length)];
                const newQuestions = [...questions];
                newQuestions[currentIndex] = newQuestion;
                setQuestions(newQuestions);
                loadQuestion(newQuestion);
            };

            const handleAvailableWordClick = (wordObj) => {
                if (feedback === 'correct') return;
                if (feedback === 'wrong') setFeedback(null);

                if (difficulty === 'hard') {
                    setUserSlotsHard(prev => [...prev, { ...wordObj, status: 'filled' }]);
                } else {
                    const firstEmptyIndex = slots.findIndex(s => s.status === 'empty');
                    if (firstEmptyIndex !== -1) {
                        const newSlots = [...slots];
                        newSlots[firstEmptyIndex] = { ...wordObj, status: 'filled' };
                        setSlots(newSlots);
                    }
                }
                setAvailableWords(prev => prev.filter(w => w.id !== wordObj.id));
            };

            const handleSlotClick = (index, slotObj) => {
                if (feedback === 'correct') return;
                if (slotObj.status === 'locked' || slotObj.status === 'empty') return;
                if (feedback === 'wrong') setFeedback(null);

                const originalWordObj = { id: slotObj.id, text: slotObj.text };
                setAvailableWords(prev => [...prev, originalWordObj]);

                if (difficulty === 'hard') {
                    setUserSlotsHard(prev => prev.filter((_, i) => i !== index));
                } else {
                    const newSlots = [...slots];
                    newSlots[index] = { id: `slot-${index}`, status: 'empty' };
                    setSlots(newSlots);
                }
            };

            const setUserSlotsHard = (action) => {
                if (typeof action === 'function') {
                    setSlots(prev => action(prev));
                } else {
                    setSlots(action);
                }
            };

            const handleMagicHint = () => {
                if (feedback === 'correct') return;
                setFeedback(null);

                const rawSentence = questions[currentIndex].sentence;
                const spacedSentence = rawSentence.replace(/([.,!?])/g, ' $1 ');
                const targetTokens = spacedSentence.trim().split(/\s+/).filter(w => w.length > 0);

                let firstWrongIndex = -1;

                for (let i = 0; i < targetTokens.length; i++) {
                    const targetWord = targetTokens[i];
                    const currentSlot = slots[i];

                    if (!currentSlot) {
                        firstWrongIndex = i;
                        break;
                    }

                    if (currentSlot.status === 'empty') {
                        firstWrongIndex = i;
                        break;
                    }

                    if (currentSlot.text !== targetWord) {
                        firstWrongIndex = i;
                        break;
                    }
                }

                if (firstWrongIndex === -1) return;

                const targetWordText = targetTokens[firstWrongIndex];

                if (difficulty !== 'hard' && slots[firstWrongIndex].status === 'filled') {
                    handleSlotClick(firstWrongIndex, slots[firstWrongIndex]);
                }

                const correctWordInAvailable = availableWords.find(w => w.text === targetWordText);

                if (correctWordInAvailable) {
                    handleAvailableWordClick(correctWordInAvailable);
                } else {
                    if (difficulty !== 'hard') {
                        const wrongPlaceIndex = slots.findIndex((s, idx) => idx > firstWrongIndex && s.text === targetWordText && s.status === 'filled');
                        if (wrongPlaceIndex !== -1) {
                            const wordToMove = slots[wrongPlaceIndex];
                            const newSlots = [...slots];
                            newSlots[wrongPlaceIndex] = { id: `slot-${wrongPlaceIndex}`, status: 'empty' };

                            newSlots[firstWrongIndex] = { ...wordToMove, status: 'filled' };
                            setSlots(newSlots);
                            speakText(wordToMove.text);
                        }
                    }
                }
            };

            const handleGiveUpClick = () => {
                setFeedback(null);
                setShowGiveUpConfirm(true);
            };

            const confirmGiveUp = () => {
                const rawSentence = questions[currentIndex].sentence;
                const spacedSentence = rawSentence.replace(/([.,!?])/g, ' $1 ');
                const targetTokens = spacedSentence.trim().split(/\s+/).filter(w => w.length > 0);

                const correctSlots = targetTokens.map((t, i) => ({
                    id: `ans-${i}`,
                    text: t,
                    status: 'locked'
                }));

                setSlots(correctSlots);
                setAvailableWords([]);
                setFeedback('correct');
                setShowGiveUpConfirm(false);
            };

            const checkAnswer = () => {
                const userText = slots.map(s => (s.status === 'empty' ? '' : s.text)).join(' ').trim();

                const currentQuestion = questions[currentIndex];
                const rawSentence = currentQuestion.sentence;
                const spacedSentence = rawSentence.replace(/([.,!?])/g, ' $1 ');
                const targetText = spacedSentence.trim().split(/\s+/).join(' ');

                if (difficulty !== 'hard' && slots.some(s => s.status === 'empty')) {
                    speakText("Not finished yet");
                    return;
                }

                if (userText === targetText) {
                    setFeedback('correct');
                    setScore(prev => prev + 20);
                    speakText(currentQuestion.sentence);
                } else {
                    setFeedback('wrong');
                    speakText("Oops");
                }
            };

            const handleTryAgain = () => {
                setFeedback(null);
                setShowHelperHint(true);
                setTimeout(() => setShowHelperHint(false), 5000);
            };

            const nextQuestion = () => {
                if (currentIndex < questions.length - 1) {
                    setCurrentIndex(prev => prev + 1);
                    loadQuestion(questions[currentIndex + 1]);
                } else {
                    setShowResult(true);
                }
            };

            const currentQ = questions[currentIndex];

            if (showResult) {
                return (
                    <div className="flex flex-col items-center justify-center h-full animate-in zoom-in py-10 relative overflow-hidden">
                        <Star className="w-32 h-32 text-yellow-400 mb-6 fill-yellow-400 drop-shadow-[0_4px_0_rgba(234,179,8,1)] animate-bounce" />
                        <h2 className="text-4xl font-black text-slate-800 mb-2 tracking-tight">挑戰成功！</h2>
                        <div className="text-7xl font-black text-indigo-600 mb-8 drop-shadow-sm">{score}</div>
                        <GameButton onClick={resetGame} color="purple" className="w-64 py-4 text-xl">
                            <RefreshCw className="w-6 h-6" /> 再玩一次
                        </GameButton>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-full max-w-md sm:max-w-2xl lg:max-w-3xl mx-auto pb-24 relative">
                    {/* 老師問答視窗 (共用) */}
                    <TeacherChatModal
                        isOpen={showTips}
                        onClose={() => setShowTips(false)}
                        currentItem={currentQ}
                    />

                    {/* 難度選擇器 */}
                    <div className="flex justify-center gap-2 mb-4 flex-wrap">
                        {[
                            { id: 'easy', label: '簡易', icon: <CheckCircle className="w-4 h-4" />, color: 'green' },
                            { id: 'medium', label: '中等', icon: <LayoutList className="w-4 h-4" />, color: 'blue' },
                            { id: 'hard', label: '困難', icon: <AlertCircle className="w-4 h-4" />, color: 'red' }
                        ].map(d => (
                            <button
                                key={d.id}
                                onClick={() => setDifficulty(d.id)}
                                className={`
                                flex items-center gap-1 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-black transition-all border-b-4 active:border-b-0 active:translate-y-1
                                ${difficulty === d.id
                                        ? `bg-${d.color}-500 border-${d.color}-700 text-white`
                                        : 'bg-white border-slate-200 text-slate-400'}
                            `}
                            >
                                {d.icon} {d.label}
                            </button>
                        ))}
                    </div>

                    <div className="bg-white border-4 border-b-8 border-orange-200 rounded-3xl p-6 mb-6 text-center relative z-10 shadow-sm">
                        {/* 調整右上角按鈕位置: Hints On 移到左側或與Q並排，右上角放問老師 */}
                        <div className="flex justify-between items-start mb-2">
                            <div className="flex flex-col items-start gap-1">
                                <div className="inline-block bg-orange-100 text-orange-600 font-black px-3 py-1 rounded-lg text-xs border-2 border-orange-200">
                                    Q {currentIndex + 1}
                                </div>
                                <div className="text-xs font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded">
                                    {difficulty === 'easy' ? 'Hints On' : difficulty === 'medium' ? 'Grids On' : 'No Hints'}
                                </div>
                            </div>

                            {/* 右上角：問老師按鈕 */}
                            <button
                                onClick={() => setShowTips(true)}
                                className="p-2 bg-yellow-100 text-yellow-600 rounded-full hover:bg-yellow-200 transition-colors shadow-sm"
                                title="問老師 (Ask Teacher)"
                            >
                                <MessageCircle size={24} />
                            </button>
                        </div>

                        <h2 className="font-black text-xl sm:text-2xl text-slate-800 mb-4 leading-relaxed drop-shadow-sm">
                            {currentQ?.sentence_ch}
                        </h2>

                        <p className="text-orange-500 text-xs sm:text-sm font-bold bg-orange-50 px-4 py-1.5 rounded-full inline-block border-2 border-orange-100 animate-pulse">
                            {difficulty === 'easy' ? '已填入轉折詞與標點，請完成句子' : '請依序排列出正確的英文句子'}
                        </p>
                    </div>

                    {/* 答案區 - 增加 min-h 避免跳動 */}
                    <div className="bg-slate-200/50 rounded-3xl shadow-inner border-4 border-slate-300 min-h-[120px] sm:min-h-[160px] p-4 mb-6 flex flex-wrap content-start justify-center gap-2 relative transition-all z-10">
                        {slots.length === 0 && availableWords.length > 0 && difficulty === 'hard' && (
                            <div className="text-slate-400 font-black pointer-events-none flex flex-col items-center mt-10 w-full">
                                <Puzzle className="w-10 h-10 mb-2 opacity-50" />
                                點擊下方單字開始
                            </div>
                        )}

                        {slots.map((slot, index) => {
                            if (slot.status === 'empty') {
                                // 空格子 (Medium/Easy)
                                return (
                                    <div key={slot.id} className="w-12 h-10 rounded-lg border-2 border-dashed border-slate-300 bg-slate-100/50 flex items-center justify-center">
                                    </div>
                                );
                            } else if (slot.status === 'locked') {
                                // 預先填入的 (Easy/Medium)
                                return (
                                    <div key={slot.id} className="bg-slate-300 text-slate-600 px-3 py-2 rounded-lg font-bold border-b-2 border-slate-400 text-sm select-none">
                                        {slot.text}
                                    </div>
                                );
                            } else {
                                // 使用者填入的 (Filled)
                                return (
                                    <button
                                        key={slot.id}
                                        onClick={() => handleSlotClick(index, slot)}
                                        className="bg-indigo-500 text-white px-3 py-2 rounded-lg font-bold shadow-[0_2px_0_rgb(55,48,163)] active:shadow-none active:translate-y-1 transition-all border-b-2 border-indigo-700 text-sm animate-in zoom-in"
                                    >
                                        {slot.text}
                                    </button>
                                );
                            }
                        })}
                    </div>

                    <div className="h-16 mb-4 flex items-center justify-center gap-2 z-10 relative">
                        {feedback === 'correct' ? (
                            <div className="w-full bg-emerald-100 border-4 border-emerald-300 text-emerald-700 px-6 py-2 rounded-3xl flex items-center justify-between shadow-lg animate-in slide-in-from-bottom-2">
                                <div className="flex items-center gap-2 font-black text-lg"><CheckCircle className="w-6 h-6 text-emerald-500" /> CORRECT!</div>
                                <GameButton onClick={nextQuestion} color="green" className="text-xs">
                                    NEXT <ChevronRight className="w-4 h-4" />
                                </GameButton>
                            </div>
                        ) : feedback === 'wrong' ? (
                            <div className="w-full flex justify-center animate-in shake">
                                <button
                                    onClick={handleTryAgain}
                                    className="bg-rose-500 text-white border-b-4 border-rose-700 active:border-b-0 active:translate-y-1 px-8 py-3 rounded-2xl font-black text-lg shadow-xl flex items-center gap-2 hover:bg-rose-600 transition-all w-full justify-center"
                                >
                                    <XCircle className="w-6 h-6" /> TRY AGAIN!
                                </button>
                            </div>
                        ) : (
                            <>
                                {/* 工具列 */}
                                <div className="flex gap-1.5 relative">
                                    {showHelperHint && (
                                        <div className="absolute -top-20 left-0 bg-white border-4 border-sky-400 p-3 rounded-2xl w-48 shadow-xl z-50 animate-in fade-in slide-in-from-bottom-2">
                                            <p className="text-sky-600 text-xs font-black mb-1">💡 需要幫忙？</p>
                                            <div className="absolute -bottom-3 left-6 w-4 h-4 bg-white border-b-4 border-r-4 border-sky-400 transform rotate-45"></div>
                                        </div>
                                    )}
                                    <GameButton onClick={handleChangeQuestion} color="white" className="py-2 px-2" title="換一題">
                                        <RefreshCw className="w-5 h-5" />
                                    </GameButton>
                                    <GameButton onClick={handleMagicHint} color="yellow" className="py-2 px-2" title="提示下一個字">
                                        <Wand2 className="w-5 h-5" />
                                    </GameButton>
                                    <GameButton onClick={handleGiveUpClick} color="red" className="py-2 px-2" title="查看答案">
                                        <Flag className="w-5 h-5" />
                                    </GameButton>
                                </div>

                                <GameButton onClick={checkAnswer} disabled={availableWords.length > 0} color="blue" className="flex-1 py-3 text-lg shadow-lg">
                                    <CheckCircle className="w-5 h-5" /> 檢查
                                </GameButton>
                            </>
                        )}
                    </div>

                    {/* 下方單字庫 - 增加 padding 讓手機更好點 */}
                    <div className="flex flex-wrap gap-2 justify-center z-10 relative pb-4">
                        {availableWords.map((wordObj) => (
                            <button
                                key={wordObj.id}
                                onClick={() => handleAvailableWordClick(wordObj)}
                                className="bg-white text-slate-700 px-3 py-2 sm:px-4 sm:py-3 rounded-lg font-bold shadow-[0_2px_0_rgb(203,213,225)] active:shadow-none active:translate-y-1 transition-all border-b-2 border-slate-300 text-sm sm:text-base hover:border-indigo-300 hover:text-indigo-600"
                            >
                                {wordObj.text}
                            </button>
                        ))}
                    </div>

                    {showGiveUpConfirm && (
                        <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm rounded-3xl animate-in fade-in">
                            <div className="bg-white p-6 rounded-3xl border-4 border-slate-200 shadow-2xl max-w-xs text-center transform scale-100 animate-in zoom-in">
                                <h3 className="text-xl font-black text-slate-800 mb-4">放棄挑戰？</h3>
                                <div className="flex gap-3 justify-center">
                                    <GameButton onClick={() => setShowGiveUpConfirm(false)} color="blue" className="text-sm">
                                        繼續嘗試
                                    </GameButton>
                                    <GameButton onClick={confirmGiveUp} color="gray" className="text-sm">
                                        顯示答案
                                    </GameButton>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Main App Container ---
        function Unit34App() {
            const [activeTab, setActiveTab] = useState('study');
            const [currentGroup, setCurrentGroup] = useState('group1');

            const groupTitle = EXAM_DATA[currentGroup].title;
            const unitData = EXAM_DATA[currentGroup].vocab;

            return (
                // 外層容器：增加 max-w-2xl 讓電腦版更寬敞，pb-10 避免底部內容被吃掉
                <div className="min-h-screen font-sans text-slate-800 flex flex-col bg-sky-50 bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] [background-size:16px_16px] pb-10">
                    <div className="bg-white/90 backdrop-blur-sm sticky top-0 z-40 border-b-4 border-slate-200">
                        <div className="max-w-md sm:max-w-xl md:max-w-3xl mx-auto px-4 py-3">
                            <div className="flex justify-between items-center mb-3 bg-slate-100 p-2 rounded-2xl border-2 border-slate-200">
                                <div className="flex items-center gap-2 font-black text-slate-600 text-sm tracking-tight ml-2">
                                    <Map className="w-4 h-4 text-sky-500" />
                                    <span>SELECT RANGE</span>
                                </div>

                                {/* 兩個大區間按鈕 */}
                                <div className="flex gap-2">
                                    {['group1', 'group2'].map(gKey => (
                                        <button
                                            key={gKey}
                                            onClick={() => setCurrentGroup(gKey)}
                                            className={`
                                px-4 py-2 text-sm font-black rounded-xl transition-all border-b-4 active:border-b-0 active:translate-y-1
                                ${currentGroup === gKey
                                                    ? 'bg-sky-500 border-sky-700 text-white shadow-sky-200'
                                                    : 'bg-white border-slate-300 text-slate-400 hover:bg-slate-50'}
                                `}
                                        >
                                            {EXAM_DATA[gKey].range}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                <GameButton
                                    onClick={() => setActiveTab('study')}
                                    active={activeTab === 'study'}
                                    color={activeTab === 'study' ? 'active' : 'white'}
                                    className="text-[11px] sm:text-sm py-3 px-2"
                                >
                                    <Layers className="w-4 h-4" /> 句子學習
                                </GameButton>
                                <GameButton
                                    onClick={() => setActiveTab('quiz')}
                                    active={activeTab === 'quiz'}
                                    color={activeTab === 'quiz' ? 'active' : 'white'}
                                    className="text-[11px] sm:text-sm py-3 px-2"
                                >
                                    <CheckCircle className="w-4 h-4" /> 單字測驗
                                </GameButton>
                                <GameButton
                                    onClick={() => setActiveTab('blank')}
                                    active={activeTab === 'blank'}
                                    color={activeTab === 'blank' ? 'active' : 'white'}
                                    className="text-[11px] sm:text-sm py-3 px-2"
                                >
                                    <Library className="w-4 h-4" /> 填空問答
                                </GameButton>
                                <GameButton
                                    onClick={() => setActiveTab('sentences')}
                                    active={activeTab === 'sentences'}
                                    color={activeTab === 'sentences' ? 'active' : 'white'}
                                    className="text-[11px] sm:text-sm py-3 px-2"
                                >
                                    <Puzzle className="w-4 h-4" /> 句子重組
                                </GameButton>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 max-w-md sm:max-w-xl md:max-w-3xl mx-auto w-full p-4 pt-6">
                        <div className="mb-6 text-center">
                            <span className="inline-flex items-center gap-2 bg-slate-800 text-white text-xs font-black px-4 py-1.5 rounded-full border-2 border-slate-600 shadow-md">
                                <Map className="w-3 h-3 text-yellow-400" />
                                目前進度：{groupTitle}
                            </span>
                        </div>

                        {activeTab === 'study' && <StudyMode data={unitData} />}
                        {activeTab === 'quiz' && <QuizMode data={unitData} />}
                        {activeTab === 'blank' && <FillBlankMode data={unitData} />}
                        {activeTab === 'sentences' && <ScrambleMode data={unitData} />}
                    </div>
                </div>
            );
        }

        // --- 渲染到 HTML 頁面 ---
        const root = createRoot(document.getElementById('root'));
        root.render(<Unit34App />);

    </script>
</body>

</html>
